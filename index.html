<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="./manifest.json">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<meta name="theme-color" content="#1B1B47">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Star-Lord">
<title>Star-Lord Command</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9EAF1; --card:#FFFFFF; --card-2:#F0F1F6;
  --ink:#1B1C32; --ink-soft:#4C4E66; --ink-faint:#8A8CA1;
  --pine:#272763; --pine-d:#1B1B47; --moss:#5FA336;
  --clay:#D8362F; --amber:#F2A81D; --ok:#5FA336;
  --line:#D7D9E4; --line-soft:#E5E6EF;
  --c-community:#D8362F; --c-creative:#7E4196; --c-outdoors:#5FA336; --c-growth:#EF8022;
  --shadow:0 2px 0 rgba(27,28,50,.05), 0 8px 24px -12px rgba(27,28,50,.30);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Hanken Grotesk',-apple-system,sans-serif;background:var(--paper);color:var(--ink);
  background-image:radial-gradient(circle at 12% 18%,rgba(255,255,255,.55),transparent 38%),
    radial-gradient(circle at 88% 82%,rgba(39,39,99,.06),transparent 42%);
  -webkit-font-smoothing:antialiased;line-height:1.5;}
.app{max-width:600px;margin:0 auto;padding:0 0 96px;min-height:100%}
header{padding:16px 18px;position:sticky;top:0;z-index:30;
  background:linear-gradient(135deg,#322F7C 0%,#222250 52%,#1B1B45 100%);
  box-shadow:0 6px 18px -10px rgba(27,28,50,.5);overflow:hidden}
header:before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:
    radial-gradient(1.3px 1.3px at 14% 30%,rgba(255,255,255,.9),transparent),
    radial-gradient(1px 1px at 33% 72%,rgba(255,255,255,.6),transparent),
    radial-gradient(1.4px 1.4px at 57% 22%,rgba(255,255,255,.78),transparent),
    radial-gradient(1px 1px at 79% 58%,rgba(255,255,255,.55),transparent),
    radial-gradient(1px 1px at 90% 27%,rgba(255,255,255,.72),transparent),
    radial-gradient(1px 1px at 45% 86%,rgba(255,255,255,.5),transparent),
    radial-gradient(1.2px 1.2px at 70% 82%,rgba(255,255,255,.6),transparent),
    radial-gradient(1px 1px at 24% 52%,rgba(255,255,255,.5),transparent);}
.brand{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.mark{width:46px;height:46px;flex:none;object-fit:contain;border-radius:9px}
.brand h1{font-family:'Fraunces',serif;font-size:21px;font-weight:600;letter-spacing:-.01em;line-height:1.08;color:#fff}
.brand .tag{font-size:11.5px;color:rgba(255,255,255,.6);font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.spark{color:var(--amber);font-size:.6em;margin-left:5px;display:inline-block;
  animation:twinkle 2.9s ease-in-out infinite;vertical-align:0.18em}
@keyframes twinkle{0%,100%{opacity:.4;transform:scale(.85) rotate(0deg)}
  50%{opacity:1;transform:scale(1.15) rotate(15deg)}}
.view{padding:4px 16px 0;animation:rise .32s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.view-title{font-family:'Fraunces',serif;font-size:21px;font-weight:600;margin:14px 2px 4px}
.view-sub{font-size:13.5px;color:var(--ink-soft);margin:0 2px 14px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;
  padding:16px;margin-bottom:13px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card h3{font-family:'Fraunces',serif;font-size:16.5px;font-weight:600;margin-bottom:3px}
.card .hint{font-size:12.5px;color:var(--ink-faint);margin-bottom:11px}
.note{background:var(--card-2);border:1.5px dashed var(--clay);border-radius:13px;padding:13px 14px;margin-bottom:13px}
.note .lbl{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--clay);display:block;margin-bottom:4px}
.note p{font-size:13px;color:var(--ink-soft)}
.steps{display:flex;gap:8px;justify-content:center;margin:4px 2px 16px}
.chv{width:30px;height:28px;flex:none}
.chv .cf{fill:#A6A9BC;transition:fill .42s ease}
.chv .cl{fill:#E4E5EE;transition:fill .42s ease}
.chv.on .cf{fill:var(--pine)}
.chv.on .cl{fill:#CBCDDC}
.chv.on{animation:chvpulse 1.7s ease-in-out infinite}
.chv.done .cf{fill:#474B6E}
.chv.done .cl{fill:var(--amber)}
.chv.done{filter:drop-shadow(0 0 5px rgba(242,168,29,.65))}
.chv.just-locked{animation:chvlock .62s ease}
@keyframes chvpulse{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes chvlock{0%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(242,168,29,0))}
  35%{transform:scale(1.26);filter:drop-shadow(0 0 13px rgba(242,168,29,1))}
  100%{transform:scale(1);filter:drop-shadow(0 0 5px rgba(242,168,29,.65))}}
.gate-row{display:flex;gap:5px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.conn-line{font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-faint);margin-top:9px}
.mtn{position:relative;width:100%;aspect-ratio:3/2;border-radius:12px;overflow:hidden;margin:4px 0 6px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 2px 8px rgba(20,20,54,.18)}
.mtn-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.mtn-svg{position:absolute;inset:0;width:100%;height:100%}
.mtn .mn{font-family:inherit}
.mtn .mn circle{fill:rgba(28,28,71,.72);stroke:rgba(255,255,255,.7);stroke-width:1.3}
.mtn .mn text{fill:#EDEEFB;font-weight:800;text-anchor:middle}
.mtn .mn.done circle{fill:var(--amber);stroke:#FFF3D6;stroke-width:1.6}
.mtn .mn.done text{fill:#1B1B47}
.mtn .mn.auto circle{fill:rgba(28,28,71,.55);stroke:rgba(200,203,232,.6);stroke-dasharray:2.5 2}
.mtn .mn.auto text{fill:#C9CBE8}
.mtn .mn.todo circle{stroke:var(--amber);stroke-width:1.9}
.mtn .climber{fill:#FFE9A8;font-size:15px;text-anchor:middle;
  filter:drop-shadow(0 0 3px rgba(255,214,120,.9));animation:mbounce 2.4s ease-in-out infinite}
.mtn .mflag{animation:twinkle 2.9s ease-in-out infinite}
@keyframes mbounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.chart-row{display:flex;align-items:center;gap:2px;padding:6px 2px;border-bottom:1px solid var(--line-soft)}
.chart-row:not(.chart-head){cursor:pointer}
.chart-head{border-bottom:1.5px solid var(--line)}
.chart-head .ccell{font-size:8.5px;font-weight:800;text-transform:uppercase;color:var(--ink-faint)}
.cname{flex:1;min-width:0;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccell{flex:none;width:30px;text-align:center;display:flex;justify-content:center;align-items:center}
.cdot{width:13px;height:13px;border-radius:50%;background:var(--card-2);border:1.5px solid var(--line);display:inline-block}
.cdot.on{background:var(--amber);border-color:var(--amber);box-shadow:0 0 4px rgba(242,168,29,.6)}
.csia{font-size:10.5px;font-weight:800;width:19px;height:19px;border-radius:50%;display:inline-flex;
  align-items:center;justify-content:center;background:var(--card-2);border:1.5px solid var(--line);color:var(--ink-soft)}
.csia.on{background:var(--amber);border-color:var(--amber);color:#1B1B47}
.ppill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;
  color:var(--ink-soft);background:var(--card-2);border:1px solid var(--line);border-radius:20px;
  padding:2px 8px 2px 5px;margin-left:6px;vertical-align:1px}
.focusbar{display:flex;align-items:center;gap:6px;margin:0 0 10px;padding:7px 9px;
  background:var(--card);border:1px solid var(--line);border-radius:11px;
  box-shadow:var(--shadow);position:sticky;top:0;z-index:20}
.focusbar .fb-lbl{flex:1;text-align:center;font-size:12px;font-weight:800;
  letter-spacing:.05em;color:var(--ink);text-transform:uppercase}
.focusbar .btn{background:var(--card-2);border-color:var(--line);color:var(--ink)}
.patchip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;
  padding:2px 7px 2px 5px;border-radius:20px;background:rgba(0,0,0,.05);
  border:1px solid var(--line-soft);white-space:nowrap;margin-left:5px;vertical-align:middle}
.syncwarn{background:#FBE9E7;border:1.5px solid var(--clay);border-radius:11px;
  padding:10px 12px;margin:0 0 11px;font-size:12.5px;line-height:1.45;color:#7A2E12;cursor:pointer}
.syncwarn b{color:#5E220C}
.skpick{border:1.5px solid var(--pine);border-radius:9px;overflow:hidden;margin-bottom:6px}
.skpick-hd{background:var(--pine);color:#F6F1E2;padding:7px 10px;font-size:12.5px;line-height:1.4;font-weight:700}
.skpick-how{background:#fff;padding:8px 10px;font-size:12px;line-height:1.45;color:var(--ink);white-space:pre-wrap}
.skpick-how.none{color:var(--clay)}
.skhow{background:#fff;border:1.5px solid var(--line);border-top:0;
  border-radius:0 0 9px 9px;margin:-3px 0 8px;padding:8px 11px;
  font-size:12px;line-height:1.45;color:var(--ink-soft);white-space:pre-wrap}
.skhow.none{color:var(--clay)}
.skrow.ro{cursor:default;opacity:.95}
.skbox.ro{border-style:dashed;background:transparent;color:var(--moss);
  display:flex;align-items:center;justify-content:center}
.rowmore{flex:none;width:26px;display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--ink-faint);cursor:pointer;align-self:stretch}
.rowdet{margin:0 0 6px 34px;padding:8px 10px;background:rgba(0,0,0,.035);
  border-left:2px solid var(--amber);border-radius:0 7px 7px 0;font-size:12px;
  color:var(--ink-soft);white-space:pre-wrap;line-height:1.45}
.rowdet b{color:var(--ink)}
.msmini{display:flex;gap:4px;flex-wrap:wrap;margin:3px 0 0}
.msmini span{font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;
  background:rgba(0,0,0,.05);color:var(--ink-soft)}
.msmini span.thin{background:var(--amber);color:#2A2000}
.msmini span.full{background:var(--moss);color:#fff}
.pdot{width:9px;height:9px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.15)}
.pat-hd{display:flex;align-items:center;gap:8px;font-size:14px;padding-bottom:6px;border-bottom:1.5px solid var(--line)}
.pat-hd .pdot{width:12px;height:12px}
.rolebadge{flex:none;font-size:9.5px;font-weight:800;letter-spacing:.05em;padding:3px 8px;
  border-radius:12px;background:var(--pine);color:#fff}
.climb-list{margin-top:2px}
.ob-box{background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin:4px 0 6px}
.ob-hd{font-size:11px;color:var(--ink-soft);margin-bottom:7px;line-height:1.3}
.ob-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.ob-cell{display:flex;flex-direction:column;gap:2px}
.ob-cell label{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint)}
.ob-cell input{width:100%;padding:5px 7px;border:1px solid var(--line);border-radius:7px;font-size:13px;font-family:inherit}
.climb-row{display:flex;gap:9px;align-items:flex-start;padding:7px 2px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.climb-row .climb-txt{font-size:12.5px;line-height:1.35}
.climb-row .climb-txt span{color:var(--ink-faint);font-size:11.5px}
.climb-row.don .climb-txt{color:var(--ink-faint)}
.climb-row.don .climb-txt b{text-decoration:line-through;font-weight:600}
.peak-gate{display:flex;gap:5px;margin:4px 0 2px}
.peak-chev{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:0}
.peak-chev .chv{width:26px;height:24px}
.peak-chev .pcl{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;
  color:var(--ink-faint);text-align:center;line-height:1.06}
.step-tag{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
.step-tag .n{font-family:'Fraunces',serif;font-size:13px;font-weight:700;color:var(--clay);
  letter-spacing:.06em;text-transform:uppercase}
label.fld{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;color:var(--ink-soft);margin:11px 0 5px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;font-family:inherit;
  font-size:15px;color:var(--ink);background:var(--card-2);border:1.5px solid var(--line);
  border-radius:10px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pine);background:#fff}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%235D5440' stroke-width='2' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 13px center;padding-right:34px}
.btn{font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;border:none;border-radius:11px;
  padding:13px 18px;transition:transform .08s ease,filter .15s ease}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--pine);color:#F6F1E2}
.btn.clay{background:var(--clay);color:#F6F1E2}
.btn.ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line)}
.btn.full{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:9px}
.btn-row{display:flex;gap:9px;margin-top:14px}
.btn-row .btn{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:13px;font-weight:600;padding:8px 13px;border-radius:999px;cursor:pointer;
  border:1.5px solid var(--line);background:var(--card-2);color:var(--ink-soft)}
.chip.on{color:#fff;border-color:transparent}
.chip[data-area="Community"].on{background:var(--c-community)}
.chip[data-area="Creative"].on{background:var(--c-creative)}
.chip[data-area="Outdoors"].on{background:var(--c-outdoors)}
.chip[data-area="Personal Growth"].on{background:var(--c-growth)}
.tgl{display:flex;align-items:center;gap:11px;padding:9px 0;cursor:pointer}
.tgl .sw{width:44px;height:26px;border-radius:13px;background:var(--line);flex:none;position:relative;transition:.15s}
.tgl.on .sw{background:var(--pine)}
.tgl .sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.tgl.on .sw:after{left:21px}
.tgl .tl{font-size:13.5px;font-weight:600}
.stage-hd{display:flex;align-items:center;gap:8px;padding:10px 11px;background:var(--pine-d);
  color:#EFE8D4;border-radius:9px;margin:9px 0 5px;cursor:pointer;font-family:'Fraunces',serif;
  font-weight:600;font-size:13.5px}
.stage-hd .cnt{margin-left:auto;font-size:11px;opacity:.8;font-family:'Hanken Grotesk';font-weight:700}
.stage-hd .ar{transition:.2s}
.skrow{display:flex;gap:9px;padding:9px 10px;border-radius:9px;border:1.5px solid var(--line);
  background:var(--card-2);margin-bottom:5px;cursor:pointer;align-items:flex-start}
.skrow.on{background:#fff;border-color:var(--pine)}
.skbox{width:20px;height:20px;flex:none;border-radius:6px;border:2px solid var(--line);margin-top:1px;
  display:flex;align-items:center;justify-content:center}
.skrow.on .skbox{background:var(--pine);border-color:var(--pine)}
.sktext{font-size:12.5px;line-height:1.42}
.roll-row{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;
  border:1.5px solid var(--line);background:var(--card-2);margin-bottom:8px;cursor:pointer}
.roll-row.present{background:#fff;border-color:var(--pine)}
.roll-row .tick{width:24px;height:24px;flex:none;border-radius:7px;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center}
.roll-row.present .tick{background:var(--pine);border-color:var(--pine)}
.roll-row .nm{font-weight:600;font-size:15px;flex:1}
.roll-row .sec{font-size:11px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em}
.peak-star{color:var(--amber);font-size:13px}
.rec-row{padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card-2);margin-bottom:10px}
.rec-row .nm{font-weight:600;font-size:14.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.seg{display:flex;gap:5px}
.seg button{flex:1;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:9px 4px;
  border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink-soft);transition:all .12s ease}
.seg button.on[data-c="-"]{background:var(--ink-faint);color:#fff;border-color:transparent}
.seg button.on[data-c="P"]{background:var(--moss);color:#fff;border-color:transparent}
.seg button.on[data-c="A"]{background:var(--amber);color:#fff;border-color:transparent}
.seg button.on[data-c="L"]{background:var(--clay);color:#fff;border-color:transparent}
.mini-cap{font-size:10.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;
  letter-spacing:.05em;margin:9px 0 4px}
.areapick{display:flex;flex-wrap:wrap;gap:5px}
.areapick .ap{font-size:11px;font-weight:700;padding:5px 10px;border-radius:7px;cursor:pointer;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink-soft)}
.areapick .ap.on{color:#fff;border-color:transparent}
.skchip{font-size:11.5px;font-weight:600;padding:6px 9px;border-radius:8px;cursor:pointer;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink-soft);margin:0 5px 5px 0;
  display:inline-block;line-height:1.35}
.skchip.on{background:var(--pine);color:#fff;border-color:transparent}
.numfield{display:inline-flex;align-items:center;gap:7px;margin:8px 12px 0 0}
.numfield label{font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase}
.numfield input{width:78px;flex:none;padding:7px 9px;font-size:14px}
.skill-tag{display:inline-flex;align-items:center;gap:7px;background:var(--card-2);border:1.5px solid var(--line);
  border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;margin:0 6px 6px 0;line-height:1.35}
.skill-tag .rm{cursor:pointer;color:var(--clay);font-weight:700;font-size:14px}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow input{flex:1}
.wk{display:flex;align-items:center;gap:9px;padding:9px;border-radius:11px;background:var(--card-2);
  border:1.5px solid var(--line);margin-bottom:7px;flex-wrap:wrap}
.wk.special .wn{background:var(--clay)}
.wk.event{border-style:dashed;border-color:var(--clay);background:#F2E9D6}
.wk.current{box-shadow:0 0 0 2.5px var(--pine);border-color:var(--pine)}
.wk .wn{width:34px;height:34px;flex:none;border-radius:9px;background:var(--pine);color:#F6F1E2;
  font-family:'Fraunces',serif;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.wk.event .wn{background:var(--amber);border-radius:50%;font-size:15px}
.wk select{flex:1;min-width:108px}
.wk .toprow{display:flex;gap:8px;width:100%;align-items:center}
.wk .fullrow{display:flex;gap:7px;width:100%}
.wk .fullrow input{flex:1}
.wk .spec-label{flex:1;font-weight:700;font-size:13px;color:var(--clay)}
.wk .areachips{display:flex;flex-wrap:wrap;gap:5px;width:100%}
.wk .areachips .chip{font-size:11px;padding:5px 9px}
.cur-btn{font-size:10.5px;font-weight:700;border:1.5px solid var(--line);background:var(--card);
  color:var(--ink-soft);border-radius:7px;padding:6px 9px;cursor:pointer;flex:none}
.cur-btn.on{background:var(--pine);color:#fff;border-color:transparent}

<script>
const OAS_SKILLS={"Bushcraft":[[1,"Stage 1 — Introductory Skills",["I know why it is important to stick to trails when outdoors.","I know about the 'Buddy' system.","I know to stop when I get lost on activities.","I know my address and location in an emergency.","I know 3 reasons for having a shelter when sleeping outdoors.","I can strike a match.","I can collect sticks for preparing a campfire.","I can demonstrate stop, drop and roll, and how that can be used in an emergency situation.","I can find the emergency exit and muster point at my Scout Hall.","I have participated in a game that requires basic navigational skills.","I can hang a clothes line at camp with a clove hitch or other knot.","I know how to pack ropes away.","I know what is in a dilly bag/mess kit and can keep it clean at camp.","I can talk about what I enjoyed, learnt, or improved upon, by playing a navigational game."]],[2,"Stage 2",["I have explained what impact I can have on local vegetation while participating in activities.","I have discussed the appropriate action I should take in the case of an accident. Consider DRSABCD.. Consider emergency services. Consider other small accidents that may happen while hiking.","I can discuss what safety precautions I should take before going out in the Bush. Consider contacting authorities and informing others. Consider other small accidents that may happen.","I know how to contact the emergency services.","I can state how many degrees there are on a compass and what degrees the cardinal points are.","I know the rules for hygiene at camp. Consider cleaning equipment/preparing food. Consider toileting.","I can protect myself when exposed to the sun while outdoors.","I can cook a snack in a fire.","I know how much water I should carry when on a hike or when taking part in an outdoor activity.","I can demonstrate a correct way to build a safe fireplace in the Bush.","I understand the basic dangers of fire, and how to be safe around them.","I can establish and find the four cardinal directions (north, south, east, west) without a magnetic compass or any electronic means.","I can demonstrate 3 knots and apply them in an activity.","I have talked about what I enjoyed, learned, or improved upon from at least two bushcraft activities.","I can suggest what I would do differently for a future bushcraft activity."]],[3,"Stage 3",["I can explain the importance of wearing the right clothing while outdoors.","I know about native flora and fauna and the risks of the benefits they pose. Consider what is poisonous. Consider what is good for wounds or to eat.","I know how and where to get the latest weather forecast for the areas I will be doing activities in.","I know the First Aid treatment for burns from hot water, grease and food.","I know how to treat cuts an minor bleeding.","I know what DRSABCD stand for and how to apply it in First Aid situations.","I can cook a meal using a camp stove.","I can name 5 different situations that could be classified as an emergency in the outdoors and can respond to a mock emergency for one of these situations.","I can identify the Southern Cross in the night sky and then find South.","I can identify three other constellations in the night sky.","I have set up and followed a simple compass trail with the support of a local map with a Group of Scouts.","I can teach the importance of the buddy system to Scouts working on Stage 1.","I have put together a personal outdoor Survival kit and can explain why I have included these items.","I can make a personal shelter out of plastic sheeting, rope and other things I have found.","I can demonstrate 5 knots in an activity or camp setting, three of which can be my Stage 2 knots.","I can talk about the ways in which my Patrol worked together while following a compass trail.","I have identified improvements I can make to my shelter next time I try building 1."]],[4,"Stage 4 — Pioneering",["I know how to protect the environment while constructing objects.","I can prepare equipment, when required, for safe transportation to activity location.","I can draw up a plan before constructing an object.","I can read the plan for a pioneering activity and understand what I am required to do.","I can select appropriate size poles and ropes for a construction project.","I can, with a Group of Scouts construct a 5 metre high flagpole on camp.","I can, with a Patrol of Scouts, construct a Scout chariot and challenge another Patrol.","I can construct something fun with my Patrol that we have researched and agreed to construct together.","I can explain the safety precaution to take when undertaking construction projects.","I have used two different types of lashings, which are new to me, in a construction project at this Stage.","I can identify improvements in the way we go about future construction activities, including techniques, safety, teamwork, and outcomes.","I have checked equipment for damage and discussed if it needs to be repaired or replaced."]],[4,"Stage 4 — Survival Skills",["I know how to protect the environment when building shelters and lighting fires.","I can prepare equipment, for safe transportation to activity location.","I can understand the plan for a survival activity and what I am required to plan for.","I can think of five things I would want in my Survival kit.","I am familiar with the signs and symptoms of hypothermia and hyperthermia.","I can signal for help from the ground where the help will come from the air.","I have lit a fire in dry and wet conditions.","I have tried different ways to purify water for drinking and can talk about when it is appropriate to do so.","I have built a shelter big enough for three, made of only natural materials found outdoors and rope, and I have slept out in it for one night.","I can orientate a map to the surrounding landscape with and without a compass.","I can estimate distance travelled while on a Scouting activity without electronic means.","I have discussed the basic survival skills and why each one is important.","I can identify where I can improve my survival skills for next time I try a survival challenge.","I have checked equipment for damage and discussed if it needs to be repaired or replaced."]],[5,"Stage 5 — Pioneering",["I have considered risks involved in pioneering activities and have put together a risk assessment with the support from others.","I have helped design 3 construction projects for camp, taken into consideration safety of self and others at this Stage.","I know how to use a camp axe or Bose or safely (opening, closing, passing, cleaning, caring for, sharpening, cutting) and know how to store them safely.","I have successfully completed a Provide First Aid (including CPR) course from a recognised provider.","I can help construct a camp kitchen including a camp oven and basin.","Using spars [poles] and rope, I have constructed a 3 metre high tower or a bridge over a three metre span in conjunction with safe workplace practices.","I have taken part in at least 5 construction projects by the end of Stage 5.","I have built a structure that doesn't need ropes to construct.","I have prepared a short presentation for my Section Council on the pioneering projects I have been involved in so far.","I have thought about other skills I would like to learn in pioneering.","I can talk to others about what has gone well and what could be done better on future pioneering projects."]],[5,"Stage 5 — Survival Skills",["I have planned a meal for a survival camp taking into consideration limited access to cooking resources.","I can identify five types of cloud, what those cloud types mean and weather patterns.","I can identify ways to protect myself from being seen, heard or smelt by fauna.","I have helped a Scout in a lower Stage put together a Survival Kit and explain to them the use of each item.","I know how to gain permits or permission to gain access to locations when required.","I have successfully completed a Provide First Aid (including CPR) course from a recognised provider.","I have picked a survival base skill that I would like to learn and have developed skills in this area. - Consider something you haven't learned yet to do with fire, water, shelter, food or camouflage.","I have used 3 different ways to purify water for drinking, and I know the limitations, advantages and disadvantages of each method.","I can make a prediction about the local weather through natural signs.","I can identify three native plants that can support me either medically or nutritionally.","I can determine my location without electronic means by refreshing my navigational skills from Stages 1-4. - Consider using a fix or cross-section using back bearings.","I have refreshed my survival shelter skills and assist in the planning of a survivor style camp for a minimum of one night focusing on the basic survival skills.","I have prepared a short presentation for my Section Council on the survival challenges I have participated in, and the skills I have developed.","I have thought about other survival skills I would like to learn.","I can talk to others about what has gone well and what could be done better on future survival challenges."]],[6,"Stage 6 — Pioneering",["I understand I have taken the appropriate actions to maintain health and well being on a pioneering project.","I have led the planning of a construction project, taking into consideration minimal impact principles when sourcing materials that are not readily available to me.","I have worked with a team of Scouts to plan and construct a major project which is 5 metres high or 10 metres long or can shelter a minimum of a Patrol. - Consider doing this on a camp or activity for a purpose other than just meeting this requirement.","I have used pulleys to help with a construction project.","I have taught and tested a Stage 4 Scout on their construction activities.","I have built and cooked on a personal-sized stove made out of recycled materials.","I know how to care for and maintain Group equipment during a construction activity.","I have learned two extra knots, lashings or splices to assist me in pioneering.","I have taken part in 10 construction activities by the end of Stage 6.","I have given a presentation to a Group of Scouts at a lower Stage on a pioneer activity I have completed.","I can teach the correct maintenance of pioneering equipment to Scouts at Stage 4."]],[6,"Stage 6 — Survival Skills",["I understand the principles of body temperature controls and the use of clothing.","I have assisted in the planning of a survival camp taking into consideration minimal impact principles when choosing a campsite.","I know how to send a signal for help [without any electronic means] in 4 different ways that can be observed by air searches.","I have knowledge of different ground search techniques.","I can light a fire using only mechanical means [flint and steel or friction].","I can demonstrate how to determine my position on a map using back bearings and triangulation or resection.","I have navigated using a magnetic compass bearing [untracked] for three kilometres to a predetermined fixed point.","I have considered the impact that myself and others have on the environment and have run an activity focusing on minimal impact when enjoying the outdoors.","I can demonstrate two ways to correctly obtain water under survival conditions.","I know how to care for and maintain Group equipment during a survival activity.","I can light a fire in adverse conditions using natural materials.","I have given a presentation about my survival experiences to a Group of Scouts at a lower Stage.","I can teach the correct maintenance of survival gear to Scouts at Stage 4."]],[7,"Stage 7 — Advanced Pioneering",["I can plan and lead a major construction project on a camp.","I can plan activities that utilise construction projects that I have led in the design of.","I can organise required transportation for construction materials and identify how to manage fatigue.","I can prepare and describe an emergency plan for expected risks and hazards during construction projects.","I can construct a 2:1, 3:1 and 4:1 rope pulley system to raise or move loads or tension lines.","I have assisted in building an entryway for a major campsite.","I have led a Scout Group and participated in five days of campsite construction maintenance or clean up work at a local campsite.","I can explain to a Group of Scouts the advantages and disadvantages of at least four different types of ropes e.g manila sisal, nylon polypropylene including demonstrating the best method of knotting the ends of these ropes.","I have completed Stage 5 in the three core outdoor adventure skills.","I give feedback to my project Patrol on how we could improve our construction project in the future."]],[7,"Stage 7 — Advanced Survival Skills",["I can plan and lead a Bush survival camp of two consecutive nights or more.","I can prepare and describe an emergency plan for expected risks and hazards during survival camps.","I can organise the packing and transportation of Group activity for a survival camp and identify how to manage fatigue.","I have researched plants and animals that are safe for me to eat if I need to do so.","I know how to gain special permissions to modify parks or land managers standard procedures.","I can identify the signs and symptoms of hyperthermia and hypothermia, dehydration and gastro and explain the risks of delayed treatment of these conditions in a survival setting.","I can demonstrate the treatment of the above listed medical conditions.","I have built a snare or small trap during a survival activity.","I have assisted in a search and rescue drill.","I can apply different ways to not be observed by native fauna.","I have taught Scouts in lower Stages to determine their location on a map using a topographic map and magnetic compass and to make their way to another location on the map.","I can send and receive a HELP or mayday message from another person or party.","I have incorporated edible plants insects or fish as part of a camp meal.","I have completed Stage 5 in three core outdoor adventure skills.","I give feedback to my Project Patrol on how we could improve our Survival Challenge skill development in the future."]],[8,"Stage 8 — Advanced Pioneering",["I have mentored a Stage 6 Scout with one of their construction projects including minimal impact procedures.","I have designed a piece of play equipment and while doing so have taken into consideration legislation around such equipment.","I have led a team of Scouts to successfully design and construct a bridge to span over a river or Creek. - Consider where they might need to be a bridge in your local area or Scout hall. -Consider safety measures and regulations for this task.","I can back slice short splice and eye splice a three-strand rope.","With only materials found in the Bush, rope and plastic sheeting I have built a 10 person camp dining shelter protected on all sides from the weather.","I have made four metres of three strand rope from only natural plant products found outdoors.","I have successfully completed the Wilderness First Aid Skill Set.","I have been involved in 10 large scale pioneering projects at the completion of Stage 8.","I can describe a construction plan and how the needs of participants have been met in its development."]],[8,"Stage 8 — Advanced Survival Skills",["I have given a lesson to a Scout in a lower Stage on obtaining drinkable water in the Bush in all seasons","I have mentored Scouts in lower Stages in the planning of a survival camp","I can cook a complete camp meal using only improvised natural cooking surfaces and devices (cooking only using flat stones, wood planks, cooking cranes or hooks, spit1s, covered pits or trenches).","I can plan and cook a three course camp meal for attendance of a survival camp using traditional methods such as a haybox or similar.","I can find the Southern Cross and use it to navigate at night to and/or from a campsite or activity along with identifying four other constellations by which it is possible to navigate without a compass. Note: This path should be at least 3KM in length.","I have successfully completed the Wilderness First Aid Skill Set.","using only natural materials I can light and maintain a fire in heavy rain conditions.","I know how to set up and lead a ground search exercise for a missing person using a hasty search and a grid search all in an area of a minimum of two square kilometres in size.","I can describe a survival plan and how the skill development needs of participants have been met in its creation."]],[9,"Stage 9 — Advanced Pioneering",["I have kept my First Aid qualifications up to date.","I have designed a large scale pioneering project that I would like to construct and have put proper project management controls in place.","I have organised a two-day pioneering skills camp for Scouts at Stages 3-5.","I have led a team to build a large temporary pole and lashing gateway entrance for a Jamboree or camping activity site.","I have built furniture to be used under the dining shelter at the Jamboree or camp that I have built the gateway for.","I have managed and facilitated the build of the large scale pioneering project outlined in the planning Stage. - Note: The planning through completion Stage should take at least three months and involves a team that you manage.","I know all the safety techniques operating procedures personal protective equipment and hazard identifications to use a chainsaw to saw wood from fallen trees.","I have given a presentation to a Group of Scouts on how I have gained skills from completing the Bushcraft Outdoor Adventure Skills."]],[9,"Stage 9 — Advanced Survival Skills",["I have kept my First Aid qualifications up to date.","I have organised at least three survival skills camps for other Scouts.","I have mentored a Scout in a lower Stage to build and use an improvised portable water filter.","I have led a team on an excavation simulation exercise of a victim being carried on an improvised stretcher for a minimum of one kilometre.","I have facilitated a Stage 7 or below Scout in how to find and use native flora and fauna in a meal.","I have designed and helped a Stage seven or below team of Scouts to build a survival long term shelter for a Patrol.","I have developed a plan for a Group survival in a large scale natural emergency. - Consider researching and design of flood, fire, earthquake or other natural disaster plan.","I have given a presentation to a Group of Scouts on how I have gained skills from completing the Bushcraft Outdoor Adventure Skills."]]],"Bushwalking":[[1,"Stage 1 — Introductory Skills",["I can help pack a backpack for a day walk. Consider what is needed. Consider the best way of packing it.","I can dress myself for the walk. Consider the best types of clothes for bushwalking. Consider if I will be comfortable in different weather conditions.","I can list what food to bring on a day bushwalk. Consider what would be good for me and give me energy. Consider what is nutritious and can be lightweight.","I know why it is important to stick to trails when outdoors. Consider why the trail is there.","I know why to stop when I get lost in the Bush.","I can put together a small personal First Aid kit for our bushwalk. Consider blisters, dehydration and small wounds that may be encountered along the way.","I can explain the 'Buddy' system.","I can identify the four main cardinal points of the compass.","I can identify the main parts of the compass.","I have attended at least one bushwalk of at least one hour's duration at this Stage.","I can demonstrate behaving safely while bushwalking. Consider the environment, people, and equipment.","I can talk about what I enjoyed or learnt from going on a Bush walk."]],[2,"Stage 2 — Basic Walking Skills",["I can explain what clothing I should wear whilst bushwalking. Consider different types of fabric. Consider different types of environments.","I have explained what impact I can have on local vegetation when bushwalking.","I have discussed the appropriate action I should take in the case of an accident or emergency. Consider DRSABCD. Consider emergency services. Consider other small accidents that may happen while bushwalking.","I can discuss what safety precautions I should take before going out for a Bush walk. Consider contacting authorities an informing others. Consider packing the equipment you should carry to keep the Group safe.","I know when and how to contact the emergency services in an emergency.","I can draw or list all of the essential equipment to bring on a bushwalk.","I can use a compass to find basic directions. Try a simple navigational task around your local hall or park. Try taking a bearing and consider magnetic variation.","I can protect myself when exposed to the sun while outdoors.","I have attended at least two short Bush walks at this Stage.","Before I start bushwalking, I can show where and when I'm allowed to go. Consider the map and the rest of the Group.","I have Bush walked a total distance of at least 10 kilometres.","I have talked about what I enjoyed, learned, or improved upon from at least 2 bushwalks","I can suggest what I would do differently on a future bushwalk to enjoy it more, to be safer, to learn new things, or to be more challenging.","I have reviewed my list or picture of essential equipment with my Patrol and Leaders."]],[3,"Stage 3 — Basic Walking Skills",["I can help a Stage 1 Scout to pack their backpack for a bushwalk.","I know how and where to get the latest weather forecast for the area I will be bushwalking in.","I can help plan a balanced menu for bushwalking. Consider nutritional value, variety, and weight.","I can list places where I can and cannot bushwalk.","I can talk about different ways of keeping a Group together while bushwalking.","I have considered bushwalk etiquette when planning for a journey.","I can be responsible for my safety and aware of my surroundings.","I have run a small navigational activity for my fellow Scouts with the support of my leaders.","I can use different types of maps to help me throughout different activities.","I have attended a day walk at this Stage of at least six hours duration. Consider leading a small part of the bushwalk.","I have attended at least two bushwalking activities at this Stage.","I know how to avoid becoming lost, and I know what to do if I get lost.","I know how to treat cuts and minor bleeding.","I can teach the importance of the buddy system and other ways to stay safe to a Scout in Stage 1.","I can identify the features of a tropographical map.","I have given a presentation to my Patrol or my Unit Council about one of the bushwalks I went on during Stage 3.","I have discussed the top five things I have learned throughout Stages 1-3 of bushwalking."]],[4,"Stage 4 — Intermediate",["I can read a trip itinerary for a proposed bushwalk and understand what I am required to plan for and what my role is.","I know how to select equipment and protective clothing, including footwear, according to expected weather conditions.","I always ensure pack weight is appropriate to my body weight and level of fitness. -Consider if the type of equipment, including weather equipment, used in Stage 1 is still the equipment to be used in Stage 4.","I always ensure my equipment weight is distributed throughout my pack so my centre of gravity is balanced while bushwalking.","I am aware of a range of communication devices and can choose appropriate communication equipment for the location I am in.","I can work with others to prepare a menu and food list for a weekend Bush walk.","I can obtain and become familiar with the appropriate map for the intended walk.","I can identify natural navigational aids. - Consider the different natural navigational aids and have a go trying to use some on a bushwalk.","I have throughout the planning Stage become more familiar and confident with taking a bearing including accounting for magnetic variation.","I can apply ascending and descending techniques on slopes. - Consider the different types of techniques and aids available.","I know how to adopt appropriate posture when lifting and carrying a backpack.","I can demonstrate the approach to hazards safely and minimise risks to self and Group where possible.","I have taken part in and logged a 2 day bushwalk at this Stage.","I can identify improvements I can make in planning and leading future bushwalking trips.","I have checked bushwalking equipment for damage and discussed if it needs to be repaired or replaced.","I have discussed with my Patrol and Leaders what my key learnings are from the Bushwalking journey."]],[5,"Stage 5 — Intermediate",["I know how to identify food and water requirements for multiday bushwalks. - Consider food drops and alternate source if possible .","I know how to purify water for drinking.","I can assist Stage 3 Scouts to select appropriate footwear for various Bush walks.","I can minimise damage to the environment while bushwalking.","I can, with the support for my Patrol and Leaders, develop a risk management plan for a two-night Bush walking.","I can identify possible hazards associated with bushwalking and procedures to minimise risks and I know how to take actions to minimise these risks.","I can plan an overnight or weekend bushwalk including selecting an appropriate location using a topographical map and understand Naismith's rule. - Consider all logistical, organisational policy, safety, navigational, environmental, equipment and personal requirements.","I can properly select the clothing required for bushwalking, based on the seasonal requirements such as layering of clothing and protective clothing.","I have with assistance appropriately briefed all members of a bushwalking party and support people about our journey.","I have successfully completed aProvide First Aid (including CPR) course from a recognised provider.","I can find directions without a compass.","I can use a map and compass to find my position on the ground.","I can be an active member of my team while bushwalking.","I can bushwalk rough terrain safely using appropriate gear as required.","I can look after Group safety and morale on a bushwalk.","I can use a minimum of three communication devices to send a message","I have taken part in and logged two bushwalking activities at this Stage at least one of which is a 2 night bushwalk that I have led without leaders attending.","I have given a presentation to our Section Council or Unit on the journey that I have led highlighting the successes the learnings and the areas for improvement.","I can reflect on the journey that I led and what I learnt about myself in the experience."]],[6,"Stage 6 — Intermediate Bushwalking",["I can teach a Scout in a lower Stage what to pack for a weekend bushwalk.","I can plan all aspects of a three night bushwalk with a small Patrol.","I know where sources of information about bushwalking equipment selection can be gained.","I can organize the transportation required for an activity I am leading.","I have appropriately briefed all members of a bushwalking party and support people about our journey.","I can plan and lead an activity in the wilderness area which contributes to environmental improvement.","I can demonstrate the use of each item of Group and personal emergency equipment usually taken on a weekend bushwalk. Consider communication, First Aid and cooking/shelter.","I can incorporate the use of handrails catching features and other natural navigational aids into a bushwalking plan while on a bushwalk.","I can teach a Scout in a lower Stage how to care for, store and maintain the Group equipment.","I can maintain my pack for various bushwalking adventures.","I can obtain coordinates from a point of interest on a topographical map for input into a GPS Unit.","I can demonstrate the limitations of the compass and other navigational tools.","I can recognise changing weather patterns while bushwalking.","I can be responsible for myself and my Patrol while Bush walking.","I have taken part in a three-night, four-day bushwalk and one other bushwalk at this Stage.","I have bushwalked at least 100 Kilometres by the end of Stage six, including four overnight Bushwalks.","I can store bushwalking equipment in an appropriate manner.","I have evaluated relevant aspects of the bushwalk - route, safety, risk management, equipment, provisions, the challenge, learning opportunities, degree of difficulty etc.","I can identify improvements in my planning and leading future bushwalks."]],[7,"Stage 7 — Advanced Bushwalking",["I can show how to pack a bushwalking pack for a bushwalking expedition of more than two nights to a Stage 5 Scout or below.","I can plan a bushwalking expedition for four nights or more in a location that I have not been before.","I can assess risk and be aware of Group safety.","I can safely plan a river crossing for my party ensuring I can comply with relevant legislation and policies as well as protecting the environment.","I can choose appropriate lightweight bushwalking equipment.","I understand Tuckman's Stages of Group development and have looked into different Group dynamics.","I have appropriately briefed all members of a bushwalking party and support people about our journey.","I have completed Stage five in the three core Outdoor Adventure Skills (Stage 4 and five of Survival Skills).","I can inspect Group emergency equipment for a bushwalking expedition of more than two nights.","I can show what Group equipment to bring on a bushwalking expedition for 4 nights and explain why each item is needed.","I can navigate at night.","I can explain how much food is needed on bushwalking expeditions of various lengths.","I can maintain a bearing around a significant obstacle.","I have taken part in a four-night, five-day bushwalk that is unaccompanied by adult leaders at this Stage.","I can teach appropriate bushwalking etiquette to other Scouts.","I have planned and led 5 bushwalks of various lengths and in various environments without an adult leader since Stage four.","I can make changes to my Groups outing for safety reasons.","I have facilitated a debrief session for a bushwalk I have led at this Stage, including positive affirmations of member contributions, and offering feedback on areas for improvement.","I have reviewed by bushwalking equipment for its weight, need of item and durability and can access whether it is still fit for purpose."]],[8,"Stage 8 — Advanced Bushwalking",["I can assist a Scout in a lower Stage. How to pack for a bushwalking expedition.","I can assist a Scout in a lower Stage. How to plan a bushwalk in unfamiliar territory using appropriate tools.","I can produce planning documents for a long Bush walk that covers all the requirements, including logistics, equipment, food, group safety, etc.","I can make recommendations to improve Group equipment.","I can implement low impact environmental practises during bushwalks, including complying with regulations and standards.","I understand how to manage conflict that may arise while on extended trips.","I can follow correct emergency response procedures in the event of an accident.","I can plan and carry out an expedition with my project Patrol of at least five days with 6-8 hours of activity per day and a minimum of three different campsites. As a guide the distance should be between 60 to 100 KM depending on location and season.","I have successfully completed the Wilderness First Aid Skill Set.","I can teach how to read weather patterns outdoors without the use of weather forecasts.","I can take responsibility for our Group on a Bushwalking Adventure.","I can navigate accurately and safely over rough terrain and in difficult circumstances including different types of weather and at night.","I have been an active participant in at least three search and rescue and evacuation drills at this Stage.","I have taken time to reflect on my development. through Stages 4 through eight, recording my reflection in a way that suits me best.","I have put together a presentation for my Unit on our 5 day journey, highlighting the successes, the learnings and the areas for improvement."]],[9,"Stage 9 — Advanced Bushwalking",["I have kept my First Aid qualifications up to date.","I can lead the budget preparation and manage every aspect of a week long expedition with a small Patrol.","I can develop a detailed risk management plan for an expedition involving challenging terrain for a period of seven days or more.","I have organised a Navigation Training day for Scouts at Stage 5, 6 and 7, to teach them to navigate in a broad range of unmodified areas and conditions to determine my location and potential hazards.","I can conduct field repairs on my personal and Group equipment as required for various bushwalking expeditions.","I have navigated in a broad range of untracked or unmodified landscapes.","I have demonstrated the ability to check equipment for working condition, safety and suitability, according to relevant legislation and manufacturer recommendations.","I am responsible for others in various situations, on bushwalking expeditions, six nights or more.","I have applied clear and accurate instructional techniques to impact activity, specific knowledge, bushwalking skills, and safety procedures during bushwalking seasons.","I have supported another Scout up to Stage 7 requirements in bushwalking.","I have bushwalked at least 300KM by the end of Stage 9.","I have given a presentation to a Group of Scouts on the skills I have gained from completing the Bushwalking Outdoor Adventure Skills.","I have considered what I would like to do with the level of skill I have gained through the bushwalking stream of the Outdoor Adventure Skills and discussed it with a trusted mentor."]]],"Camping":[[1,"Stage 1 — Introductory Skills",["I know about the \"Buddy\" system.","I know the boundaries of where I am allowed to go each time I go out camping.","I know to stop when I get lost while camping.","I know the basic elements that you need to make a fire.","I know that I should follow directions from the leader of this activity.","I can help pack a bag for camp.","I can strike a match.","I can help prepare food for cooking at camp.","I have spent two nights at camps and/or Scout sleepovers","I know why it is important to set up camp in an existing campsite.","I can set out my sleeping area at camp.","I can care for my basic personal gear on an overnight camp.","I can talk about what I enjoyed, learnt or improved upon by participating in the camp or sleepover."]],[2,"Stage 2 — Basic Skills",["I can explain what clothing I should wear whilst camping.","I have explained what impact I can have on local vegetation while camping.","I have discussed the appropriate action I should take in the case of an accident.","I can discuss what safety precautions you should take before going camping outdoors.","I know about proper hygiene practises at camp.","I know how to contact the emergency services.","I can draw and label a picture showing all of the essential equipment to bring on a camp.","I know the benefits and risks associated with fire.","I can demonstrate basic safe food handling and the importance of hygiene at camp.","I can protect myself when exposed to the sun while outdoors.","I can behave safely in and around tents and fires at camp.","I can demonstrate and explain why sleeping bags need to be aired out.","I have spent two nights on camp in a tent at this Stage.","I can help set up a tent and identify the main parts of a tent.","I have talked about what I enjoyed, learned, or improved upon from at least two camps.","I can suggest what I would do differently on a future camp to enjoy it more, to be safer, or to learn new things."]],[3,"Stage 3 — Basic Skills",["I can pack my own bag for camp.","I know how and where to get the latest weather forecast for the area I will be camping in.","I can help plan a balanced meal for camp.","I know the benefits of using gas to cook and can talk about what risks to watch out for in regards to using gas.","I can list Group equipment required for camp.","I know how to maintain personal hygiene while camping.","I can assemble a personal First Aid kit for a camp.","I know what DRSABCD stand for and how to use it in First Aid situations.","I can demonstrate keeping myself safe from natural and man made things at camp. Consider feet care, suncare, burns, falls, splinters, etc.","I can help build a campfire and collect materials to do so.","I can cook a meal on a campfire with assistance.","I have used a gas cooker to help cook a camp meal.","I can help run an activity at camp.","I can set up a tent, without help from an adult.","I have spent five nights on a camp in a tent by the end of this Stage.","I know how to treat cuts and minor bleeding.","I can teach the importance of the buddy system to a Stage 1 Scout.","I can demonstrate how to store food at camp.","I have learnt 3 knots that can help me during a standing camp.","I have discussed the ways I can improve the camping activity that I assisted in.","I have discussed my camping and how improvements can be made."]],[4,"Stage 4 — Intermediate",["I can prepare equipment where required, for safe transportation to an activity location.","I can identify appropriate campsites.","I know how to select equipment and protective clothing according to expected weather conditions.","I can work with others to prepare a menu and food list for a weekend camp.","I know about proper hygiene practises at camp and can discuss these with a Stages Two Scout.","I can plan an activity for a camp that I will go on at this Stages.","I can read an itinerary for a proposed camp and understand what I am required to do.","I am familiar with the signs and symptoms of hypothermia and hyperthermia.","I can implement safe sanitary practises at camp to avoid illness and environmental impacts.","I have assisted to pitch a bell tent, canvas troop tent or similar.","I have participated in five nights of camping at this Stage, three of which are consecutive.","I can demonstrate and assist Stage Two Scouts in setting up a tent.","I can help organise a campsite setup and pack down.","I can cook a meal at camp without assistance.","I can safely light an extinguish a campfire.","I can demonstrate the correct care and maintenance of Group gear during and between camps.","I know how to dry and store a tent.","I can identify improvements that could be made for future camping trips I participate in or lead.","I have checked equipment for damage and discussed if it needs to be repaired or replaced."]],[5,"Stage 5 — Intermediate",["I can select camp sites that minimise damage to the environment.","I can identify possible hazards associated with camping and procedures to minimise risks and I know how to take actions to minimise these risks.","I can plan suitable access to water, appropriate to the size of the Group and location.","I know where to source information about camping equipment selection.","I know how to plan for activities in all weather conditions.","I can show the personal gear needed for an overnight lightweight camp.","I can plan a camping trip in accordance with organisational policies.","I have successfully completed a Provide First Aid (including CPR) course from a recognised provider.","I can teach another Scout what to pack for camp.","I can demonstrate the appropriate measures for minimising and dealing with food waste, solid waste and human waste to protect the environment while camping.","I can demonstrate the best layout for a campsite and explain my reasoning including the type of ground, the position of trees, proximity to water, local fauna, shade and shelter.","I can cook a three course meal using a camp oven, portable hike stove or open fire.","I can demonstrate how to repair minor damages to tents.","I have participated in two nights of lightweight camping.","I have spent 16 nights away camping by the end of Stage Five.","I have completed Stage five in the three core outdoor adventure skills.","I have identified improvements that could be made to the three-course meal for next time I prepare a menu and cook on camp"]],[6,"Stage 6 — Intermediate Camping",["I can plan and lead a weekend camp.","I can plan a programme of activities for a camp.","I can complete a risk management matrix for a camp.","I can plan and organise the equipment and menu for a camp in extreme weather conditions.","I can help organise transportation to camp.","I can choose the best tent for a specific camp.","I can demonstrate to others how to care for, store and maintain Group gear for camp.","I have led a Group to pitch a bell tent canvas troop tent or similar.","I can teach another Scout in Stages 3 or 4 to prepare a meal to be cooked on a fire.","I have participated in a camp in extreme weather conditions.","I can assist a Stage 4 Scout to set up a tent.","I have spent 22 nights at camp in different seasons, one of which is at least three consecutive nights by the end of Stage 6.","I have identified which equipment was useful and practical in an extreme weather camp and I can recommend what to take next time to others.","I have reviewed and updated my risk management plans after a camp."]],[7,"Stage 7 — Advanced Camping",["I can plan activities for at least two different types of camps.","I know how to identify and manage fatigue.","I can prepare and describe an emergency plan for expected risks and hazards at camp.","I can plan for a camp to have outcomes during the planning Stages and can facilitate development of participants through a camp setting.","I can teach the use of various stoves and their effective use to another Scout.","I understand Tuckman's Stages of Group development. Consider other Group development models as well.","I can demonstrate how to plan for and adapt to changing weather patterns at a camp.","I can assist a Stage 5 Scout to organise a Stage 5 camping activity.","I can brief my team on appropriate behaviours at camp in conjunction with local requirements.","I can take responsibility for myself and my team whilst on camp.","I have been a camp leader for a minimum of two camps by the completion of Stage 7.","I have spent 32 nights at camp in a range of seasons by the end of Stage seven including three nights without an adult while completing Stage 7.","I can provide feedback to my Patrol on how we could improve our camping in the future considering risk management safety activities equipment management location selection, level of difficulty, etc."]],[8,"Stage 8 — Advanced Camping",["I have mentored someone else who is responsible for planning and leading a camp","I can make recommendations to improve Group equipment for various camp types","I can describe a camp plan and how the needs of participants have been met in its development.","I know how to deal with conflict and have resolution strategies to deal with issues that may arise.","I can determine if specialised training is required for camp activities and I can organise this training.","I have conducted a four night camp as the camp chief facilitating the development of the participants in different interest areas.","I can teach a Scout in Stages 6 or lower on how to care for store and maintain Group gear needed for camp.","I have successfully completed the Wilderness First Aid skill set.","I have spent 40 nights on various types of camps by the end of Stage eight.","I have taken time to reflect on my development in Stages four through eight, recording my reflection in a way that suits me best.","I have put together a presentation for my Unit on our four night camp as Camp Chief highlighting the successes the learnings and the areas for improvement."]],[9,"Stage 9 — Advanced Camping",["I have kept my First Aid qualifications up to date.","I can source amenities and local places of interest for various camp types.","I have learnt a new skill during Stages 7-9 that I can facilitate others learning during a camp I will run in Stage 9.","I can budget prepare and manage every aspect of a camping expedition.","I can plan to execute camping expeditions in all types of locations and regions including where possible Interstate and internationally.","I have investigated and made recommendations to purchase equipment for specific camping requirements.","I am able to source the training required for a specific camp or activity.","I have acted as the outing leader on at least five camping expeditions.","I have planned and led a camping trip Interstate or international in an unfamiliar location to me for a minimum of 3 nights.","I have spent 60 nights on various types of camps by the end of Stage 9.","I have completed after incident action review and incident reports for either real or mock incidents that have occurred whilst on camping trips.","I have given a presentation to a Group of Scouts on the skills I have gained from completing the Camping Outdoor Adventure skills Stagess."]]],"Alpine":[[1,"Stage 1",["I can help pack a bag for a snow trip.","I know how to dress when I go on a snow trip.","I can explain the buddy system.","I know the importance of staying on the trail whilst at the snow.","I know why to stop when I get lost in the snow.","I know how to contact the emergency services.","I have built something out of snow.","I know how to stay dry or change to dry clothes when I am on a snow trip.","I follow the instructions of the activity leader when at a snow trip","I have been tobogganing","I can take care of my equipment for the duration of a day trip to the snow.","I can talk about what I enjoyed by participating in a snow trip."]],[2,"Stage 2",["I can explain what impact I can have a little vegetation when snow hiking or tobogganing overexposed shrubs.","I can discuss the appropriate action I should take in the case of an accident.","I can discuss what safety precautions I should take before going out in the snow.","I can label a picture describing all of the essential equipment to bring to the snow.","I have walked for one kilometre in the snow.","I can protect myself when exposed to the elements associated with snow while outdoors.","Before I start my snow activity, I can show where and when I'm allowed to go.","I have tried two different snow activities at this Stage.","When I come inside, I can put away my outdoor clothing so it will dry quickly.","I have talked about what I enjoyed, learned, or improved upon from at least 2 snow activities.","I can suggest what could be done differently on a future snow hike or activity, to enjoy it more, to be safer, or to learn new things."]],[3,"Stage 3",["I can pack for a day pack for a snow trip.","I know how and where to get the different weather forecasts for the area I will be in for my snow activity.","I know and can explain the effect of weather on Alpine activities.","I understand layering principle when dressing for snow activities.","I can plan a balanced meal for activities on the snow.","I have learned 8 main points of the compass.","I know what DRSABCD stands for and how to use it in First Aid situations","I am familiar with signs and symptoms of hypothermia and hyperthermia.","I have participated in an Alpine sport (eg downhill skiing, cross-country skiing, snowshoeing, snowboarding) at this Stage.","I have completed a journey of at least three kilometres using specialised snow equipment.","I have demonstrated my basic navigation skills during our Alpine sport activity.","I have built an emergency shelter in the snow, with a small Group.","I can teach the importance of the buddy system to a Scout in Stage 1.","I have made a basic First Aid kit that I take with me on all snow activities.","I have discussed with my Patrol ways we can improve safety for our next Alpine adventure.","I can identify Alpine sports skills I would like to learn or improve."]],[4,"Stage 4 — Cross Country Skiing",["I can list conditions that may make skiing more hazardous or difficult.","I know how to obtain and keep a supply of safe drinking water in the Alpine environment.","I know how to identify food and water requirements for day trips including the increased needs arising from a days cross country scheme.","I can read a planned Group itinerary for a proposed skiing trip and take responsibility for bringing or organising some of the equipment.","I can identify various Alpine signs and their meanings for skiers.","I have taught a Stage 2 Scout or below how to dress for the Alpine environment.","I can fit and adjust my own skiing equipment.","I can participate in a ski tour while carrying a day pack that I have packed myself with the gear I require.","I can demonstrate snow ploughing, herringboning, sidestepping while on cross country skis.","I can safely fall over when unable to stop.","I can demonstrate a safe approach to hazards and minimise risks to myself and the Group where possible.","I have taken part in two days of cross country ski touring at this Stage.","I can identify where I have begun to improve my cross country skiing skills and where I would like to further improve.","I have checked equipment for damage and discussed if it needs to be repaired or replaced."]],[4,"Stage 4 — Downhill Skiing",["I can list conditions that make skiing more hazardous or difficult.","I can read a planned Group itinerary for a proposed skiing trip and understand what I am required to do.","I can identify various Alpine signs and their meaning.","I can select suitable clothing and equipment and check that it is in good working order.","I can identify and plan food and water requirements according to principles of nutrition and the conditions of the activity.","I have taught a Stage 2 Scout or below how to dress for the Alpine environme ent."]],[7,"Stage 7 — Intermediate Mountain Biking",["I have completed Stage five of the three core outdoor adventure skills.","I can research mountain bike trails and routes applicable to my ability level.","I can plan a full weekend of mountain biking activities.","I can determine what personal protective equipment my mountain biking activity might require.","I know how to adjust mountain bike components such as front forks to suit my activity.","I have assisted a Stage 5 or below Scout with learning some mountain biking handling techniques.","I can demonstrate appropriate posture and maintain control and balance at all times when riding off road on intermediate to difficult terrain while conserving energy and momentum.","I can maintain a repair mountain biking equipment in the field using an infield repair kit.","I can navigate routes and negotiate difficult situations according to relevant legislation and organisational policies and procedures.","I have undertaken at least 15 days of mountain biking activities by the end of Stage 7.","I can ride at intermediate level on a mountain bike trail.","I have led a mountain biking activity at this Stage.","I can assist a Stage 5 Scout or below to fit and adjust their bike and equipment.","I can assist the other members of my group to conduct repairs in the field using an infield repair kit.","I can facilitate a skills development session for Stage 5 Scouts and below.","I have demonstrated removing mud and dirt from a bicycle and spraying all moving parts with appropriate lubricant.","I have facilitated a debrief session for a mountain biking journey I have led at this Stage including positive affirmations of member contributions and offering feedback on areas for improvement."]],[8,"Stage 8 — Advanced Cycle Touring",["I have examined and planned for extensive logistical requirements for a trip that I am leading.","I can compare and contrast different bike frames and components to assist others to find an appropriate fit.","I know how to determine measures to deal with non routine problems and or repairs in a group setting.","I have successfully completed the Wilderness First Aid skill set.","I can communicate with cyclists, motorists, and other users, to apply road etiquette for the benefit of my group.","I have assisted a Stage 6 or below Scout with selecting appropriate tyre choice and pressure depending on the expected terrain and load.","I can negotiate hazards and obstacles safely and take measures to guard personal and group safety in all situations and on all rides.","I have led an extended multi night trip at this Stage.","I have assisted a Stage 6 Scout or below to secure touring equipment in different ways so to ensure a low centre of gravity and items stays secured on the bike.","I know how to examine a bicycle for defects and repair or arrange for repair in a timely manner.","I have evaluated relevant aspects of the cycling journey route safety risk management equipment provisions the challenge, learning opportunities degree of difficulty, etc.","I can identify improvements in my planning and doing, for future rides."]],[8,"Stage 8 — Advanced Mountain Biking",["I have established a suitable communication system to use when riding in a group.","I have developed a plan for a mountain bike trail to be built or a current one to be revamped or maintained.","I have developed the complex logistics of at least one mountain biking activity.","I have assisted a Scout at Stage 6 or below to correct any deficiencies in their mountain bike and help them to adjust their mountain bike so that it is correctly proportioned and safe for use.","I have assisted a Scout at Stage 6 or below to determine measures to deal with non routine problems and or repairs.","I have successfully completed the Wilderness First Aid skill set.","I can communicate with mountain bikers motorists and other users and apply trail etiquette.","I have assisted a Stage 6 or below Scout with selecting appropriate t  presentation to a group of Scouts on the skills I have gained from completing the Cycling Outdoor Adventure skills."]],[9,"Stage 9 — Advanced Mountain Biking",["I have kept my First Aid qualifications up to date.","I have researched and determined trails for five mountain bike routes.","I have planned and led at least three mountain bike activities.","I have developed an extensive risk management plan for a long distance mountain bike ride.","I have taught mechanical skills to other Scouts up to Stage 7.","I have participated extensively in cross country, downhill and enduro mountain biking activities, accumulating to at least 10 days of mountain biking.","I have taught mountain biking skills to Scouts who are working on Stages 5, 6, and 7.","I have led the construction, maintenance or revamping of a mountain biking trail.","I have evaluated my personal leadership development on two mountain biking activities.","I have given a presentation to a group of Scouts on the skills I have gained from completing the Cycling Outdoor Adventure skills."]]],"Vertical":[[1,"Stage 1 — Introductory Skills",["I know what the best types of clothes for a rock activity are and can dress myself for an activity.","I know not to break or damage trees when climbing them.","I know what to do if I get lost at an activity.","I can explain the buddy system.","I have discussed what the purpose of a helmet is.","I know the safety rules for climbing on rocks, trees, fences and man-made structures.","I have been to a rock playground and know how to play safely and cooperatively with others.","I can take care of my personal equipment for the duration of a rock activity.","I know how to wear and adjust a helmet.","I know how to contact the emergency services.","I can talk about what I enjoyed, learned, or improved upon by participating in a rock-based activity."]],[2,"Stage 2 — Basic Skills",["I can discuss what safety precautions you should take before going on a rock activity.","I can put on my o ation.","I can research a variety of self belay techniques and the best applications for them.","I can research a variety of rescue techniques for caving activities.","I can set up a belaying system safely in the low light environment of a cave.","I have been party leader for one section of a caving journey.","I can abseil using a self belay.","I have belayed or spotted someone climbing into a cave.","I always demonstrate appropriate techniques to minimise damage to the environment while caving.","I have undertaken at least seven activity days of caving by the end of Stage 6.","I have demonstrated the correct posture for beginning and abseiling descent to a Stage four or below Scout.","I have assisted in setting up abseils in a cave environment.","I have assisted in setting up multiple types of belays for different caving situations.","I have belayed other Scouts on different types of belays.","I can safely escape a belay while keeping the abseiler safe.","I can assist in rigging a caving ladder.","I can ascend a rope in a cave environment.","I can demonstrate the correct maintenance of Group gear following the conclusion of A caving activity."]],[6,"Stage 6 — Intermediate Climbing",["I can teach another youth what to pack for a climbing activity of my choice.","I can plan and lead a climbing activity with qualified supervision.","I can help organise the transportation required for an activity.","I can discuss hazards of climbing activities to Stage 4 Scouts or below.","I can put together a comprehensive risk assessment for a climbing activity that is coming up.","I can research the best gear for an activity application.","I can research a variety of climbing techniques and the best applications for them.","I can research a variety of rescue techniques for climbing activities.","I know why site and activity specific minimal impact is important in climbing activities.","I know of hazards associated with climbing on natural surfaces and minimise risks to ensure the pe ce abseiling expeditions and understanding the benefits of completing a log book entry for their vertical adventures."]],[8,"Stage 8 — Advanced Canyoning",["I can teach my Group or patrol how to prepare for a canyoning expedition.","I can plan for best practise minimal impact activities and can assist a Stage 6 Scout or lower on why site and activity specific minimal impact is important in canyon activities.","I can teach another Scout how to plan a single pitch, Canyon trip.","I can plan my personal equipment and consider needs for Group equipment for a multi pitch Canyon activity.","I have successfully completed the Wilderness First Aid skill set.","I have the ability to identify safe entry and exit from the Canyon, including emergency routes.","I can establish new or alternate anchors in non routine situations or when designated anchors may not be available or suitable for use.","I am able to identify hazardous features of hydrological formations and determine alternative routes to avoid.","I have swam and navigated waterways in a variety of canyons.","I can determine an appropriate instructional plan according to participants needs and characteristics and by following relevant legislation and organisational policies and procedures.","I have monitored participants safety and performance while canyoning and can provide appropriate feedback.","I have led abseiling rescue drills lasting at least half a day demonstrating rescue skills that include self rescue, pluck and lower and a haul system rescue.","I know how to interpret whether an environmental information and determine contingency plans.","I have received feedback and can evaluate relevant aspects of a canyoning trip, and determine the level of learning achieved.","I apply clear and accurate instructional techniques to impart activity specific knowledge and safety and rescue procedures.","I have completed 30 canyons by the completion of Stage 8, five of which I have been the party leader for","I have mentored
