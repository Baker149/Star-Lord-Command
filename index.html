const DRIVE_FILE='Star-Lord-Command-Data.json';
let _pushTimer=null,_authPending=null;
function saveDrive(){Store.set('muster.drive',JSON.stringify(S.drive));}
function tokenValid(){return S.drive&&S.drive.tok&&S.drive.tok.v&&Date.now()<S.drive.tok.exp;}
function appRedirect(){let p=location.pathname;
  if(p.endsWith('index.html'))p=p.slice(0,-'index.html'.length);
  return location.origin+p;}
let _redirFail=false;
function parseAuthHash(){
  if(!location.hash)return;
  const h=location.hash;
  if(h.indexOf('access_token')<0&&h.indexOf('error=')<0)return;
  try{
    const p=new URLSearchParams(h.slice(1));
    if(p.get('error')){_redirFail=true;}
    else{
      let ok=true;
      try{ok=p.get('state')===localStorage.getItem('muster.dstate');}catch(e){}
      if(ok&&p.get('access_token')){
        _authPending={v:p.get('access_token'),exp:Date.now()+((+p.get('expires_in')||3600)-90)*1000};
        try{localStorage.removeItem('muster.dnr');}catch(e){}
      }
    }
  }catch(e){}
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
}
let _tokClient=null,_tokWaiter=null,_lastSilentFail=0;
function gisReady(){return !!(window.google&&google.accounts&&google.accounts.oauth2);}
function ensureTokClient(){
  if(_tokClient)return _tokClient;
  if(!gisReady()||!S.drive.clientId)return null;
  _tokClient=google.accounts.oauth2.initTokenClient({
    client_id:S.drive.clientId,
    scope:'https://www.googleapis.com/auth/drive.file',
    callback:(resp)=>{const w=_tokWaiter;_tokWaiter=null;
      if(resp&&resp.access_token){
        S.drive.tok={v:resp.access_token,exp:Date.now()+((resp.expires_in||3600)-60)*1000};
        S.drive.enabled=true;_lastSilentFail=0;saveDrive();renderDriveStatus();
        if(w)w(true);}
      else{_lastSilentFail=Date.now();if(w)w(false);}},
    error_callback:()=>{const w=_tokWaiter;_tokWaiter=null;_lastSilentFail=Date.now();if(w)w(false);}
  });
  return _tokClient;}
function freshToken(interactive){
  if(tokenValid())return Promise.resolve(true);
  if(!interactive&&Date.now()-_lastSilentFail<300000)return Promise.resolve(false);
  const tc=ensureTokClient();
  if(!tc)return Promise.resolve(false);
  return new Promise(res=>{_tokWaiter=res;
    try{tc.requestAccessToken({prompt:interactive?'consent':''});}
    catch(e){_tokWaiter=null;_lastSilentFail=Date.now();res(false);}});}
function driveAuthURL(silent){
  const cid=(S.drive.clientId||'').trim();
  if(!cid)return null;
  const st=uid()+uid();
  try{localStorage.setItem('muster.dstate',st);}catch(e){}
  return 'https://accounts.google.com/o/oauth2/v2/auth'
    +'?client_id='+encodeURIComponent(cid)
    +'&redirect_uri='+encodeURIComponent(appRedirect())
    +'&response_type=token'
    +'&scope='+encodeURIComponent('https://www.googleapis.com/auth/drive.file')
    +'&include_granted_scopes=true'+(silent?'&prompt=none':'')+'&state='+st;
}

async function dFetch(url,opts){
  const r=await fetch(url,Object.assign({},opts,{headers:Object.assign(
    {Authorization:'Bearer '+S.drive.tok.v},(opts&&opts.headers)||{})}));
  if(r.status===401){S.drive.tok=null;saveDrive();throw new Error('auth');}
  if(!r.ok)throw new Error('drive '+r.status);
  return r;
}
async function driveFindFile(){
  if(S.drive.fileId){
    try{await dFetch('https://www.googleapis.com/drive/v3/files/'+S.drive.fileId+'?fields=id');return S.drive.fileId;}
    catch(e){if(e.message==='auth')throw e;S.drive.fileId='';}
  }
  const q=encodeURIComponent("name = '"+DRIVE_FILE+"' and trashed = false");

async function drivePush(){

      +'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+b+'--';
    const r=await dFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',

// Merge remote into local key by key. Returns {pulled:[],pushNeeded:bool}.
// A key is only taken from remote if remote's clock for THAT key is newer.
function remoteKeyAt(env,k){
  const ka=env.keyAt&&typeof env.keyAt==='object'?env.keyAt:null;
  if(ka&&typeof ka[k]==='number')return ka[k];
  return env.updatedAt||0;   // old envelopes had one clock for everything
}
function mergeRemote(env){
  const d=env.data||{};
  const pulled=[];let pushNeeded=false;
  S.meta.keyAt=S.meta.keyAt||{};
  SYNC_KEYS.forEach(k=>{
    const rAt=remoteKeyAt(env,k), lAt=S.meta.keyAt[k]||0;
    const has=Object.prototype.hasOwnProperty.call(d,k)&&d[k]!=null;
    if(has&&rAt>lAt){
      if(k==='year')S.year=migrateYear(d.year,null);else S[k]=d[k];
      S.meta.keyAt[k]=rAt;pulled.push(k);
    }else if(lAt>rAt){pushNeeded=true;}
  });
  if(pulled.length){
    rosterDefaults();
    pulled.forEach(k=>Store.set('muster.'+k,JSON.stringify(S[k])));
  }
  S.meta.updatedAt=Math.max(S.meta.updatedAt||0,env.updatedAt||0,
    ...SYNC_KEYS.map(k=>S.meta.keyAt[k]||0));
  Store.set('muster.meta',JSON.stringify(S.meta));
  if(pulled.includes('year')){
    if(S.year.cur&&!planFind(S.year.cur.id).it)S.year.cur=null;
    if(!S.night.saved&&S.night.step===1){applyCurrent(S.night);save('night');}
  }
  return {pulled,pushNeeded};
}
let _syncBusy=false;
async function driveSync(mode){
  if(!S.drive.enabled||_syncBusy)return;_syncBusy=true;try{await _driveSyncInner(mode);}finally{_syncBusy=false;}}
let _lastSyncWork={pulled:[],pushed:false};
async function _driveSyncInner(mode){
  if(!S.drive.enabled)return;
  if(!tokenValid()){
    const got=await freshToken(mode==='manual');
    if(!got){
      if(mode==='manual'){if(gisReady())uiAlert('Google sign-in did not complete — try Sync again.');else driveConnect();return;}
      // invisible renewal: bounce through Google with prompt=none (works where iOS blocks the iframe trick)
      if(document.visibilityState==='visible'&&navigator.onLine!==false&&canSilentRedirect()){
        S.drive.status='Renewing link…';renderDriveStatus();driveSilentRedirect();return;}
      S.drive.status='Link down — tap Sync to sign back in';renderDriveStatus();
      return;}}
  S.drive.status='Syncing…';renderDriveStatus();
  try{
    _lastSyncWork={pulled:[],pushed:false};
    const id=await driveFindFile();
    if(!id){await drivePush();_lastSyncWork.pushed=true;}
    else{
      const r=await dFetch('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media');
      let env=null;try{env=JSON.parse(await r.text());}catch(e){}
      if(!env||!env.data){await drivePush();_lastSyncWork.pushed=true;}
      else{
        const {pulled,pushNeeded}=mergeRemote(env);
        _lastSyncWork.pulled=pulled.slice();
        if(pushNeeded||pulled.length){await drivePush();_lastSyncWork.pushed=true;}
        if(pulled.length)render();
      }
    }
    S.drive.lastSync=Date.now();S.drive.status='';saveDrive();renderDriveStatus();
    if(mode==='manual'){
      const w=_lastSyncWork;
      uiAlert(w.pulled.length
        ? `Synced. Brought across: ${w.pulled.join(', ')}.${w.pushed?' Sent your changes up too.':''}`
        : w.pushed ? 'Synced. Sent your changes up — nothing newer to bring down.'
                   : 'Synced. Both copies already match.');}
  }catch(e){
    S.drive.status=(e.message==='auth')?'Link down — tap Sync to reconnect':'Sync hit a snag — try again';
    saveDrive();renderDriveStatus();
  }
}
function queuePush(){

function driveAgo(){
  if(!S.drive.lastSync)return'';
  const m=Math.round((Date.now()-S.drive.lastSync)/60000);
  return m<1?'just now':(m<60?m+' min ago':Math.round(m/60)+' hr ago');
}
function renderDriveStatus(){

}
function fmtAgo(ts){
  if(!ts)return'never';
  const s=Math.max(0,Math.round((Date.now()-ts)/1000));
  if(s<60)return'just now';
  const m=Math.round(s/60);if(m<60)return m+' min ago';
  const h=Math.round(m/60);if(h<24)return h+' hr ago';
  const d=Math.round(h/24);return d+(d===1?' day ago':' days ago');}
function driveStatusText(){
  // always say when it last synced — that is the number that tells you whether
  // this device is actually up to date, whatever the link is doing right now
  const ago=S.drive.lastSync?' · last sync '+driveAgo():' · never synced';
  if(S.drive.status)return S.drive.status+(S.drive.enabled?ago:'');
  if(!S.drive.clientId)return'Not set up yet on this device';
  if(!S.drive.enabled)return'Ready to connect'+ago;
  if(!tokenValid())return'Link idle — will reconnect on Sync'+ago;
  return'Link established'+ago;
}
function driveBoot(){
  if(_authPending){S.drive.tok=_authPending;S.drive.enabled=true;_authPending=null;saveDrive();render();}
  if(_redirFail){_redirFail=false;S.drive.status='Link down — tap Sync to sign back in';renderDriveStatus();}
  if(S.drive.enabled)driveSync('auto');
  if(S.drive.enabled)setTimeout(()=>{if(!tokenValid())driveSync('auto');},1800);
  // hands-free sync: push straight away when you leave, pull when you come back
  const kick=()=>{if(S.drive&&S.drive.enabled&&(tokenValid()||gisReady())){clearTimeout(_pushTimer);driveSync('auto');}};
  document.addEventListener('visibilitychange',kick);
  window.addEventListener('pagehide',kick);
  window.addEventListener('focus',kick);
}

function progressFor(id){
  const p={Community:0,Creative:0,Outdoors:0,'Personal Growth':0,A:0,L:0};
  S.nights.forEach(n=>{
    if(n.present&&!n.present.includes(id))return;
    const c=n.credits[id];if(!c)return;
    const t=typeof c==='string'?c:c.t;
    if(t==='P'){let a=typeof c==='object'?c.a:null;
      if(!a||p[a]==null)a=(n.areas&&n.areas[0])||n.area;
      if(p[a]!=null)p[a]++;}
    else if(t==='A')p.A++;else if(t==='L')p.L++;});
  return p;
}
/* Milestone roll-up (Tracey: "milestones restart each time").
   Total everything a scout has earned = opening balance (what they arrived with,
   banked in their current milestone) + all nights since. Then pour that pool
   into milestones in order: fill M1's targets, overflow spills into M2, then M3.
   Overflow rolls over automatically. */
function emptyMS(){return {Community:0,Creative:0,Outdoors:0,'Personal Growth':0,A:0,L:0};}
// Total earned pool = raw night counts + the scout's opening balance.
// Opening balance for milestones *below* the arrival milestone is assumed complete,
// so we pre-credit those milestones' full targets; the current milestone gets its
// entered per-area/assist/lead counts.
function msPool(id){
  const s=S.roster.find(x=>x.id===id);const raw=progressFor(id);
  const pool=emptyMS();
  for(const k in pool)pool[k]=raw[k]||0;
  if(s){
    const arr=s.milestone||1;
    const box=m=>(s.msOpening&&s.msOpening[m])||emptyMS();
    const filled=m=>{const o=box(m);return AREAS.some(a=>o[a])||o.A||o.L;};
    // Every opening box counts, whichever milestone it sits in.
    for(let m=1;m<=3;m++){const ob=box(m);for(const k in pool)pool[k]+=(ob[k]||0);}
    // Milestones already complete on arrival that were left blank: credit their
    // full targets, so nothing regresses for scouts whose figures were never typed in.
    for(let m=1;m<arr;m++){if(filled(m))continue;const tg=MS[m];
      AREAS.forEach(a=>pool[a]+=tg.P);pool.A+=tg.A;pool.L+=tg.L;}
  }
  return pool;
}
// Distribute the pool across milestones. Returns per-milestone filled counts,
// which milestone is current, and that milestone's progress toward target.
function msRollup(id){
  const pool=msPool(id);
  const fills=[emptyMS(),emptyMS(),emptyMS()];
  const rem={...pool};
  let done=[false,false,false];
  for(let m=1;m<=3;m++){const tg=MS[m],f=fills[m-1];
    AREAS.forEach(a=>{const take=Math.min(rem[a],tg.P);f[a]=take;rem[a]-=take;});
    f.A=Math.min(rem.A,tg.A);rem.A-=f.A;
    f.L=Math.min(rem.L,tg.L);rem.L-=f.L;
    done[m-1]=AREAS.every(a=>f[a]>=tg.P)&&f.A>=tg.A&&f.L>=tg.L;}
  // current milestone = first not-yet-complete (or 3 if all done)
  let cur=done[0]?(done[1]?(done[2]?3:3):2):1;
  if(!done[0])cur=1;else if(!done[1])cur=2;else cur=3;
  return {fills,done,cur,progress:fills[cur-1]};
}
// Current-milestone progress (what the Youth card shows), reset per milestone.
function msProgress(id){return msRollup(id).progress;}
// Derived current milestone from actual progress (roll-up decides, not a stored field).
function msCurrent(id){return msRollup(id).cur;}
function kmTotal(id){let t=0;S.nights.forEach(n=>{if(n.kmLog&&n.kmLog[id])t+=+n.kmLog[id]||0;});
  const s=S.roster.find(x=>x.id===id);return t+(s?+s.priorKm||0:0);}
function nightsTotal(id){let t=0;S.nights.forEach(n=>{if(n.nightsLog&&n.nightsLog[id])t+=+n.nightsLog[id]||0;});
  const s=S.roster.find(x=>x.id===id);return t+(s?+s.priorNights||0:0);}
function nextBadge(total,arr){for(const v of arr)if(v>total)return v;return null;}

  if(!n.editingId&&n.weekId){const _pit=planFind(n.weekId).it;
    if(_pit&&_pit.targetSkills&&_pit.targetSkills.length){let _added=false;
      _pit.targetSkills.forEach(ts=>{if(!n.targetSkills.some(x=>x.id===ts.id)){
        n.targetSkills.push({id:ts.id,name:ts.name,stage:ts.stage});_added=true;}});

  const chev=[1,2,3,4].map(i=>{

function stepRecord(){
  const n=S.night;
  if(!n.present.length)return `<div class="card"><div class="empty">No-one marked present.</div></div>
    <div class="btn-row"><button class="btn ghost full" data-act="back">← Back to roll</button></div>`;
  const rows=n.present.map(id=>{
    const s=S.roster.find(x=>x.id===id);if(!s)return'';
    const cr=n.credits[id];const ct=cr?(typeof cr==='string'?cr:cr.t):'-';
    const ca=(cr&&typeof cr==='object'&&cr.a)||'';
    const seg=[['-','Attended'],['P','Participate'],['A','Assist'],['L','Lead']]
      .map(([k,l])=>`<button data-act="credit" data-id="${id}" data-c="${k}" class="${ct===k?'on':''}">${l}</button>`).join('');
    let areaPick='';
    if(ct==='P'||ct==='A'||ct==='L'){
      // where this scout sits in the milestone they're on, so the thinnest area is obvious
      const rl=msRollup(id),tg=MS[rl.cur],f=rl.progress;
      const lo=Math.min(...AREAS.map(a=>f[a]||0));
      const cells=AREAS.map(a=>{const v=f[a]||0;
        const cls=v>=tg.P?'full':(v===lo?'thin':'');
        return `<span class="${cls}">${a==='Personal Growth'?'Growth':a} ${v}/${tg.P}</span>`;}).join('')
        +`<span class="${f.A>=tg.A?'full':''}">Assist ${f.A}/${tg.A}</span>`
        +`<span class="${f.L>=tg.L?'full':''}">Lead ${f.L}/${tg.L}</span>`;
      areaPick=`<div class="mini-cap">On Milestone ${rl.cur} — amber is thinnest, green is full</div>
      <div class="msmini">${cells}</div>`;
      if(n.areas.length>1)
        areaPick+=`<div class="mini-cap">This credit counts toward</div>
        <div class="areapick">${n.areas.map(a=>`<span class="ap ${ca===a?'on':''}" data-act="creditarea" data-id="${id}" data-area="${a}"
          style="${ca===a?'background:'+cssv(AREA_VAR[a]):''}">${a}</span>`).join('')}</div>`;
    }
    let skT='';
    {
      const done=n.skillsDone[id]||{};

      // skills ticked ad hoc for this scout that aren't in tonight's target list

      const chipFor=(kid,nm)=>{const cls=done[kid]?'on':(hasSkillAlready(s,kid,_es)?'got':'');

      if(n.targetSkills.length||extras.length)

          n.targetSkills.map(sk=>chipFor(sk.id,sk.name)).join('')+

      skT+=`<button class="btn ghost sm" data-act="adhocopen" data-id="${id}" style="margin-top:6px">${S._adhocSid===id?'Done adding skills':'+ tick other skills — any stream, any stage'}</button>`;
      if(S._adhocSid===id)skT+=adhocBrowser(id);
    }
    let nums='';
    if(n.logKm||n.logNights){
      nums='<div>';
      if(n.logKm)nums+=`<span class="numfield"><label>km</label>

      if(n.logNights)nums+=`<span class="numfield"><label>nights</label>

    }

      <div class="seg">${seg}</div>${areaPick}${skT}${nums}</div>`;
  }).join('');
  return `<div class="step-tag"><span class="n">Step 3 — Record the night</span></div>
  <div class="note"><span class="lbl">⚠ The integrity rule</span>
    <p>Attending is <b>not</b> a credit. Give Participate / Assist / Lead only for <b>active</b> involvement — and tick only the OAS skills each scout <b>genuinely demonstrated</b>.</p></div>
  <div class="card"><h3>${esc(n.activity||'Tonight')}</h3>
    <p class="hint">For each scout: milestone credit, OAS skills shown${n.logKm?', km':''}${n.logNights?', nights':''}. <span style="color:var(--moss)">✓ dashed green = already earned</span> — concentrate on the ones without it.</p>${rows}</div>
  <div class="btn-row"><button class="btn ghost" data-act="back">← Back</button>
    <button class="btn primary" data-act="next" style="flex:2">Sign off →</button></div>`;

function summaryText(n){
  const nm=id=>{const s=S.roster.find(x=>x.id===id);return s?s.name:'?';};
  const byT={P:{},A:{},L:{}};
  n.present.forEach(id=>{
    const c=n.credits[id];if(!c)return;
    const t=typeof c==='string'?c:c.t;if(!byT[t])return;
    let a=(typeof c==='object'&&c.a)||(n.areas&&n.areas[0])||'—';
    (byT[t][a]=byT[t][a]||[]).push(nm(id));});
  const attended=n.present.filter(id=>!n.credits[id]).map(nm);
  const block=o=>{const ks=Object.keys(o);
    return ks.length?ks.map(a=>'    '+a+':  '+o[a].join(', ')).join('\n'):'    (none)';};
  let oas;

    extra+='\n\n> WALKABOUT AWARD  —  km this activity\n'+(ks.length?ks.join('\n'):'  (none entered)');}

${fmtD(n.date)} ${n.date.slice(0,4)}  ·  ${n.weekLabel||'unscheduled'}

> OAS WORKBOOK${(()=>{const ss=[...new Set((n.targetSkills||[]).map(s=>s.id.split('|')[0]))];
  return ss.length===1?'  —  '+ss[0]+' sheet':(ss.length===0&&n.stream?'  —  '+n.stream+' sheet':'');})()}
Tick Y for each skill, only for the scouts listed:
${oas}

> MILESTONES WORKBOOK  —  Milestone sheets
Use activity "${n.activity}" + date ${fmtD(n.date)} in each cell.
  Participate:
${block(byT.P)}
  Assist:
${block(byT.A)}
  Lead:
${block(byT.L)}

Attended only — no milestone credit:
  ${attended.length?attended.join(', '):'(none)'}${extra}

Approved (unit council):  ${n.plBy||'—'}
Signed off by (leader):  ${n.signedBy}`;

      <span class="pc"><b>${p.A}/${tg.A}</b></span></div></div>
    ${needs.length?`<p class="hint" style="margin:2px 0 0">Still needs: ${needs.join(' · ')}</p>`:''}`;
  /* 3 — OAS */

    return `<span class="chip${v.cur>=5?' on':''}"${v.cur>=5?' style="background:var(--moss)"':''}>${st==='Bushcraft'?'BC':st==='Bushwalking'?'BW':'Camp'} ${v.cur}/5</span>`;}).join('');

      <span class="on1">${st}<span class="ofromtxt">from ${v.from}</span></span>

  const nx=oasNextUp(s).slice(0,2);

  /* 4 — SIAs */
  const sias=s.sias||[];const fin=siaFinished(s);

  const SIA_ICONS={'Adventure & Sport':'🏅','Arts & Literature':'🎨','Creating a Better World':'🌏','Environment':'🌿','Growth & Development':'🌱','STEM & Innovation':'🔬'};
  const areaChips=SIA_AREAS.map(a=>{const on=fin.some(x=>x.area===a);

/* ---- RULES ---- */
function badgesFor(s){
  const list=[];
  const md=msDoneCalc(s);
  [1,2,3].forEach(m=>{if(md[m-1])list.push({key:'M'+m,label:'Milestone '+m});});
  const o=oasFor(s.id);
  STREAMS.forEach(st=>{const v=o.streams[st];if(!v)return;
    for(let g=(v.from||0)+1;g<=v.cur;g++)list.push({key:'OAS_'+st+'_'+g,label:st+' Stage '+g});});

          Object.entries(w.opening).forEach(([m,box])=>{
            const b=emptyMS();Object.entries(box).forEach(([kk,v])=>b[kk]=v);s.msOpening[+m]=b;});
          s.priorKm=w.priorKm;s.priorNights=w.priorNights;
          if(w.joined)s.joined=w.joined;
          if(w.dob&&!s.dob)s.dob=w.dob;
          s.sias=(w.sias||[]).map(x=>({id:uid(),area:x.area,description:x.description||'',date:x.date||''}));
          if(!s.peakSteps||s.peakSteps.length<10)s.peakSteps=TEN_F.slice();
          s.peakSteps[1]=!!w.intro;
          s.peakSteps[0]=!!w.introScouting;
        };
        matched.forEach(([s,k])=>apply(s,k));
        unmatched.forEach(k=>{
          const w=MS_DOC[k];
          const s={id:uid(),name:w.name,section:w.section,peak:false,milestone:1,memberNo:k,
            sias:[],priorKm:0,priorNights:0,peakSteps:TEN_F.slice(),oasStart:{}};
          S.roster.push(s);apply(s,k);
        });
        rosterDefaults();
        save('roster');render();
        uiAlert(`Imported ${matched.length+unmatched.length} scouts from the July summary.`);
      });
    return;}
});
function fb(txt,btn){const ta=document.createElement('textarea');ta.value=txt;
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');btn.textContent='Copied ✓';
    setTimeout(()=>btn.textContent='Copy summary',1600);}catch(e){}

document.addEventListener('input',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  if(a==='ntext'){S.night[t.dataset.f]=t.value;save('night');
    if(t.dataset.f==='signedBy'||t.dataset.f==='plBy'){const b=document.querySelector('[data-act="signoff"]');
      if(b){const ok=S.night.activity.trim()&&S.night.areas.length&&(S.night.signedBy||'').trim()&&(S.night.plBy||'').trim();
        b.disabled=!ok;b.style.opacity=ok?'1':'.45';}}}
  if(a==='wkact'){const it=planFind(t.dataset.id).it;if(it){it.activity=t.value;save('year');}}
  if(a==='npf'){const it=planFind(t.dataset.id).it;if(it){ensurePlan(it)[t.dataset.f]=t.value;save('year');}}
  if(a==='wktime'){const it=planFind(t.dataset.id).it;if(it){it.time=t.value;save('year');}}
  if(a==='schedf'){const it=planFind(t.dataset.id).it;if(it){const r=ensurePlan(it).sched[+t.dataset.i];if(r){r[t.dataset.f]=t.value;save('year');}}}
  if(a==='npskillhow'){const it=planFind(t.dataset.id).it;if(it){ensurePlan(it).skillHow[t.dataset.k]=t.value;save('year');}}
  if(a==='nprev'){const it=planFind(t.dataset.id).it;if(it){ensurePlan(it).review[t.dataset.f]=t.value;save('year');}}
  if(a==='nrevf'){S.night.review[t.dataset.f]=t.value;save('night');}
  if(a==='revf'){const tm=viewTerm();tm.review=tm.review||{worked:'',tricky:'',ideas:''};
    tm.review[t.dataset.f]=t.value;save('year');}
  if(a==='r1f'){const it=planFind(S._r1Id).it;if(it&&it.r1){r1Set(it.r1,t.dataset.f,t.value);save('year');
    if(t.tagName==='SELECT')render();}}
  if(a==='oasstart'){const s=S.roster.find(x=>x.id===t.dataset.id);
    if(s){s.oasStart=s.oasStart||{};s.oasStart[t.dataset.st]=+t.value;save('roster');render();}return;}
  if(a==='scpatrol'){const s=S.roster.find(x=>x.id===t.dataset.id);if(s){s.patrol=t.value;save('roster');}}
  if(a==='scdate'){const s=S.roster.find(x=>x.id===t.dataset.id);if(s){s[t.dataset.f]=t.value;save('roster');}}
  if(a==='jnyf'){const s=S.roster.find(x=>x.id===t.dataset.id);if(s){s.journey=s.journey||{};s.journey[t.dataset.f]=t.value;save('roster');}}
  if(['g1n','g1p','g1e','g2n','g2p','g2e'].includes(a)){const s=S.roster.find(x=>x.id===t.dataset.id);if(s){
    s[{g1n:'g1name',g1p:'g1phone',g1e:'g1email',g2n:'g2name',g2p:'g2phone',g2e:'g2email'}[a]]=t.value;save('roster');}}
  if(a==='dclientid'){S.drive.clientId=t.value.trim();saveDrive();renderDriveStatus();}
  if(a==='faqq'||a==='faqa'){const f=S.welcome.faqs.find(x=>x.id===t.dataset.id);
    if(f){f[a==='faqq'?'q':'a']=t.value;save('welcome');}}
  if(a==='invtxt'){const f=S.welcome.invest.find(x=>x.id===t.dataset.id);if(f){f.txt=t.value;save('welcome');}}
  if(a==='filen'||a==='fileu'||a==='filenote'){const f=S.welcome.files.find(x=>x.id===t.dataset.id);
    if(f){f[{filen:'name',fileu:'url',filenote:'note'}[a]]=t.value;save('welcome');}}
  if(a==='kmlog'){const v=t.value;v===''?delete S.night.kmLog[t.dataset.id]:S.night.kmLog[t.dataset.id]=+v;save('night');}
  if(a==='nightslog'){const v=t.value;v===''?delete S.night.nightsLog[t.dataset.id]:S.night.nightsLog[t.dataset.id]=+v;save('night');}
  if(a==='priorkm'){const s=S.roster.find(x=>x.id===t.dataset.id);s.priorKm=+t.value||0;save('roster');}
  if(a==='obset'){const s=S.roster.find(x=>x.id===t.dataset.id);if(s){const cm=+t.dataset.m||s.milestone||1;s.msOpening=s.msOpening||{};if(!s.msOpening[cm])s.msOpening[cm]=emptyMS();s.msOpening[cm][t.dataset.k]=Math.max(0,+t.value||0);save('roster');}}
  if(a==='priornights'){const s=S.roster.find(x=>x.id===t.dataset.id);s.priorNights=+t.value||0;save('roster');}
  if(a==='scoutname'){const s=S.roster.find(x=>x.id===t.dataset.id);if(s){s.name=t.value;save('roster');
    const hd=t.closest('.scout');if(hd){const nm=hd.querySelector('.hd .nm');
      if(nm)nm.innerHTML=esc(t.value)+(s.memberNo?' <span class="mno">#'+esc(s.memberNo)+'</span>':'')+(s.peak?' <span class="peak-star">★</span>':'');}}}
  if(a==='scoutno'){const s=S.roster.find(x=>x.id===t.dataset.id);if(s){s.memberNo=t.value;save('roster');
    const hd=t.closest('.scout');if(hd){const nm=hd.querySelector('.hd .nm');
      if(nm)nm.innerHTML=esc(s.name)+(t.value?' <span class="mno">#'+esc(t.value)+'</span>':'')+(s.peak?' <span class="peak-star">★</span>':'');}}}
});
document.addEventListener('change',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  if(a==='ntext'){S.night[t.dataset.f]=t.value;save('night');if(t.dataset.f==='stream')render();return;}
  if(a==='r1f'){const it=planFind(S._r1Id).it;if(it&&it.r1){r1Set(it.r1,t.dataset.f,t.value);save('year');
    if(t.tagName==='SELECT')render();}return;}
  if(a==='pickweek'){if(t.value){S.year.cur={t:planFind(t.value).t,id:t.value};save('year');}
    applyCurrent(S.night);save('night');render();return;}
  if(a==='wktype'){const it=planFind(t.dataset.id).it;if(it){it.type=t.value;save('year');}render();return;}
  if(a==='termstart'){viewTerm().startDate=t.value;save('year');render();return;}
  if(a==='evstart'){const it=planFind(t.dataset.id).it;if(it){it.startDate=t.value;save('year');}return;}
  if(a==='evend'){const it=planFind(t.dataset.id).it;if(it){it.endDate=t.value;save('year');}return;}
  if(a==='evstime'){const it=planFind(t.dataset.id).it;if(it){it.timeStart=t.value;save('year');}return;}
  if(a==='evetime'){const it=planFind(t.dataset.id).it;if(it){it.timeEnd=t.value;save('year');}return;}
  if(a==='schedo'){const it=planFind(t.dataset.id).it;if(it){const r=ensurePlan(it).sched[+t.dataset.i];if(r){r.o=t.value;save('year');render();}}return;}
  if(a==='ttimes'){viewTerm().timeStart=t.value;save('year');render();return;}
  if(a==='ttimee'){viewTerm().timeEnd=t.value;save('year');render();return;}
  if(a==='evtype'){const it=planFind(t.dataset.id).it;if(it){it.type=t.value;save('year');}render();return;}
  if(a==='planstream'){const it=planFind(t.dataset.id).it;if(it){it.stream=t.value;it._openG=null;save('year');}render();return;}
  if(a==='adhocstream'){S._adhocStream=t.value;S._adhocG=null;render();return;}
  if(a==='ctag'){const c=S.contacts.find(x=>x.id===t.dataset.id);if(c){c.tag=t.value;save('contacts');render();}return;}
  if(a==='setms'){const s=S.roster.find(x=>x.id===t.dataset.id);
    // "Started at" = arrival milestone anchor for the opening balance.
    // Current milestone is derived by roll-up, so no snapshot bookkeeping.
    s.milestone=+t.value;save('roster');render();return;}
  if(a==='setsec'){const s=S.roster.find(x=>x.id===t.dataset.id);s.section=t.value;save('roster');render();return;}
  if(a==='jnyd'){const s=S.roster.find(x=>x.id===t.dataset.id);
    s.journey=s.journey||{};s.journey[t.dataset.f]=t.value;save('roster');render();return;}
  if(a==='jnyclear'){const s=S.roster.find(x=>x.id===t.dataset.id);
    if(s&&s.journey){s.journey[t.dataset.f]='';save('roster');render();}return;}
});

});
