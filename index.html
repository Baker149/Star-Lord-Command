ence climbing expeditions and understanding the benefits of completing a logbook entry for their vertical adventures."]],[9,"Stage 9 — Advanced Abseiling",["I have kept my First Aid qualifications up to date.","I can plan multi pitch abseil activities that cater to participants needs.","I can develop a detailed risk management plan for a multi pitch abseil.","I have undertaken over 50 abseling descents on various surfaces and a number of pictures.","I can safely set up multipitch abseils including the retrieval of rope and other gear.","I have demonstrated safe changeovers on multiple multi pitch abseil trips.","I have demonstrated a range of vertical rescue techniques, which include techniques used in single and multi pitch activities and when the participant is conscious and unconscious.","I have undertaken at least 20 days of abseiling by the end of Stage 9.","I can assist less experienced Scouts through the abseiling requirements of Stage 7 and evaluate their learning.","I have given a presentation to a Group of Scouts on the skills I have gained from completing the Vertical Outdoor Adventure Skills in Abseiling.","I have considered what I would like to do with the level of skill I have gained through the Vertical Outdoor Adventure Skills and have discussed it with a trusted mentor."]],[9,"Stage 9 — Advanced Canyoning",["I have kept my First Aid qualifications up to date.","I have developed a detailed risk management plan for a canyoning weekend.","I can budget prepare and manage every aspect of a weekend canyoning trip.","I have mapped out a canyoning system, taking into consideration both vertical and horizontal obstacles.","I have demonstrated a range of vertical rescue techniques which include techniques used on a single and multi pitch activities and when the participant is conscious and unconscious.","I can retrieve and manage ropes in a variety of canyon environments.","I can demonstrate to a Stage 7 Scout or below drying and then storing equipment appropriately.","I can assist less experienced Scouts through the canyoning requirements of Stage 7 and evaluate their learning.","I have assessed all anchors on multiple canyoning trip for safety and load purposes.","I can rig multiple anchor points to equalise the load and minimise shock loading.","I have led a minimum of 10 canyoning trips by the completion of Stage 9","I have logged a variety of canyoning trips by the end of Stage 9 including wet dry vertical and horizontal canyons","I have given a presentation to a Group of Scouts on the skills I have gained from completing the Vertical Outdoor Adventure Skills in Canyoning.","I have considered what I would like to do with the level of skill I have gained through the Vertical Outdoor Adventure Skills and have discussed it with a trusted mentor."]],[9,"Stage 9 — Advanced Caving",["I have kept my First Aid qualifications up to date.","I can plan a multi pitch caving activity that caters to participants need.","I can develop a detailed risk management plan for a multi pitch cave.","I have undertaken at least 10 caves which I have been the party leader on by the end of Stage 9.","I have produced a sketch map of a cave that can be used by others for navigation.","I can safely set up multi pitch caves including the retrieval of rope and other gear.","I have demonstrated safe change overs on multiple multi pitch cave trips.","I've demonstrated a range of vertical rescue techniques which include techniques used on single and multi pitch activities and when the participant is conscious and unconscious.","I can assist Scouts through the caving requirements of Stage 7 and evaluate their learning.","I can navigate in an untrogged cave.","I have given a presentation to a Group of Scouts on the skills I have gained from completing the Vertical Outdoor Adventure Skills in caving","I have considered what I would like to do with the level of skill I have gained through the Vertical Outdoor Adventure Skills and have discussed it with nt and back without assistance.","I can swim 10 metres (any stroke) without assistance.","I can put my face in the water and blow bubbles.","I can get an object of the bottom of the pool in chest-deep water.","I know three different animals that live in the ocean.","I can practise signalling for help in the water.","I have tried 2 swimming strokes.","I can talk about what I enjoyed by participating in a swimming trip."]],[2,"Stage 2",["Before I go swimming, I can point out where I'm allowed to go.","I can explain how to contact the emergency service, in the event of an emergency.","I can discuss what safety precautions you should take before going swimming.","I can pack a bag with all the clothes and equipment I will need for a swimming trip.","I can discuss different rescue techniques for someone that has fallen in water and cannot swim.","I can put on a PFD by myself.","I can swim with my head in the water.","I can protect myself when exposed to the sun an other elements while outdoors.","I can swim 25 metres (any stroke) without assistance.","I can tread water for 30 seconds.","I have taken part in a short snorkelling activity at this Stage.","I have talked about what I enjoyed, learned, or improved upon from at least two swimming trips.","I can suggest what could be done differently on a future swimming activity, to enjoy it more, to be safer, or to learn new things."]],[3,"Stage 3",["I know what DRSABCD stands for and how to use it in First Aid situations.","I can explain common water safety risks and how to avoid them.","I know how to remove a cramp in my leg with a buddy's help.","I know how and where to get different weather forecasts for outdoor swimming activities.","I know how to treat cuts and minor bleeding.","I can identify the different hazards between bodies of water such as pools, lakes, rivers and oceans.","I can put on and fit a PFD while in the water and use the Heat Exposure Lessening Position (HELP) and huddle positions.","I can swim 50 metres in a pool (using any stroke).","I can jump feet first into water that is above my head, then swim at least 25 metres without kicking off from a side or wall.","I can show three ways to rescue someone who has fallen into deep water and can't swim.","I can teach the importance of the buddy system to a Scout in Stage 1.","I can tread water for one and a half minutes.","I have discussed with my Patrol what I have learned about swimming safety from two swimming trips."]],[4,"Stage 4 — Snorkelling",["I am familiar with the signs and symptoms of hypothermia and hyperthermia.","I know what gear is necessary for a snorkelling adventure, including protective clothing, masks and sunscreen.","I know why ear equalisation is necessary when snorkelling and diving at depth.","I know the importance of not going snorkelling alone, and of notifying others of my plans before leaving.","I can swim on the surface of a pool or open water (such as a lake) for 50METRES using a mask fins and a snorkel.","I can breathe through a snorkel and adjust my mask to fit comfortably.","I have snorkelled in open water and observed at least one marine or aquatic creature.","I can recognise the signs of a panic snorkeler or diver and know how to call for help.","I can swim for 100 metres without stopping (any stroke).","I have completed two days of snorkelling by the end of Stage 4.","I can identify improvements that could be made for future snorkelling activities I participate in or lead.","I have checked equipment for damage and discussed if it needs to be repaired or replaced."]],[4,"Stage 4 — Lifesaving",["I can give a short talk to less experienced Scouts on water safety as it applies to them in particular about keeping themselves safe.","I can explain the hazards of taking deep breaths and holding your breath (shallow water blackout).","I am familiar with the signs and symptoms of hypothermia and hyperthermia.","I am able to list five different situations that could be classified as an emergency in an aquatic environment.","I can swim 25M fully clothed before removing the clothes without touching the bottom of an open body of water.","I can perform a rescue drill in the water.","I can tread water continuously for three minutes.","I can put on and remove a PFD in deep water.","I can recognise other signs of a person with difficulty in water including vertical body position, gasping for air, ineffective or lack of limb movements or remaining submerged.","I have demonstrated using a buoyancy aid to support a tied swimmer and then towed the patient, maintaining clear Airways.","I can identify where I have begun to improve my responses to incidents, and where I would like to further improve.","I have checked equipment for damage and discussed if it needs to be repaired or replaced."]],[4,"Stage 4 — Surfing",["I am familiar with the signs and symptoms of hypothermia and hyperthermia.","I know the importance of not going surfing alone, and of notifying others of my plans before leaving.","I know what gear is required for a surfing adventure, including protective clothing, board and sunscreen.","I can discuss surfer etiquette before heading out on a surf activity.","I understand what precautions to take in regards to marine life whilst surfing.","I can observe surfing etiquette when catching and riding waves.","I can trim along a broken or peeling wave up to half a metre deep","I can demonstrate how to propel the board through broken and unbroken waves and flat water whilst heading out to a wave with a leg rope attached, where applicable.","I have demonstrated correct dismount drill in both the prone and standing positions.","I have tried to catch a wave of around half a metre in height.","I have completed two days of surfing by the end of Stage 4.","I have checked equipment for damage and discussed if it needs to be repaired or replaced.","I can identify improvements in my technique for future surfing activities."]],[5,"Stage 5 — Snorkelling",["I know how to identify food and water requirements for day trips.","I can select snorkelling routes that minimise damage to the environment.","I can identify possible hazards associated with snorkelling and procedures to minimise risks.","I know where sources of information about snorkelling equipment selection can be gained.","I can help choose a suitable snorkelling destination.","I have successfully completed a Provide First Aid (including CPR) course from a recognised provider","I can be an active member of my team while snorkelling.","I can swim 200 metres on the surface wearing snorkelling equipment.","I can snorkel safely within a group using appropriate gear as required.","I can inform appropriate authorities before the snorkelling trip.","I can duck dive with snorkel and mask to 1.5 metres and fetch an item from the bottom.","I have undertaken at least five days of snorkelling by the end of stage 5.","upon surfacing from a duck dive I can clear my snorkel without lifting my head out of the water.","I have taken photos of some marine life that I have seen while snorkelling.","I have notified the relevant authorities of trip completion.","I can review my own snorkelling ability and identify potential improvements."]],[5,"Stage 5 — Lifesaving",["I know how to deal with an incident injury or illness in an outdoor location and how to summon help.","I can demonstrate to a group of Scouts how to safely remove an unconscious person from a body of water.","I can identify possible hazards associated with surfing or swimming in the ocean, lake or river (wherever is applicable to you) and procedures to minimise risks.","I have successfully completed a Provide First Aid (including CPR) course from a recognised provider","I can swim 300 metres continuously using correct techniques: 100 M freestyle 50m backstroke 50m breaststroke 50m side stroke 50m survival backstroke.","I can perform a rescue using a long object throwing a flotation object and weighted rope over a distance of 10 metres within a time limit of one minute.","I can fit a PFD correctly while treading water swim 100 metres using survival strokes demonstrate HELP (heat escape lessening posture) technique and climb out of the water whilst wearing the PFD.","I have completed a mock incident report.","I can review my own incident response performance and identify potential improvements."]],[5,"Stage 5 — Surfing",["I know how to identify food and water requirements for a surfing session.","I can select beach access routes that minimise damage to the environment.","I can identify possible hazards associated with surfing and procedures to minimise risks.","I know where sources of information about surfing equipment selection can be gained.","I can help choose a suitable surfing destination.","I can outline safety procedures and safe areas and/or boundaries for the surfing session.","I understand how to deal with marine creatures if I interact with them.","I have successfully completed a Provide First Aid (including CPR) course from a recognised provider","I can demonstrate monitoring basic manoeuvres and surfing techniques to ensure the safety of myself and other participants.","I can catch broken waves demonstrating control and basic surfing manoeuvres without wiping out.","I understand the effect of wind, tide, swell and ocean floors on surf conditions and adapt my activities to suit.","I can implement a suitable communication system for participants to use while surfing.","I understand surf survival skills and can demonstrate self rescue techniques.","I have undertaken at least five days of surfing by the end of stage 5.","I can demonstrate assessing equipment for safety and suitability and adjust and fit to ensure personal comfort.","I can review my own surfing skills development and identify potential improvements."]],[6,"Stage 6 — Snorkelling",["I can plan a snorkelling trip including equipment, food, transportation and swimming route.","I have taught a less experienced scout how to use their snorkelling equipment.","I can discuss tides and currents in coastal areas and water behaviour in rivers and creeks and how this may impact on my snorkelling.","I can identify five species in my local or regular aquatic environment either on the surface or underwater including hazardous species.","I can demonstrate effective duck diving.","I can stay in the water continuously for half an hour without touching an edge or bottom alternating between finning treading water and floating as required.","I have undertaken at least eight days of snorkelling by the end of stage six.","I have given a presentation to a group of scouts from earlier stages on a snorkelling activity I have completed.","I can demonstrate the correct maintenance of equipment following the conclusion of a snorkelling activity."]],[6,"Stage 6 — Lifesaving",["I have arranged for a group of scouts to meet with a member of a water based emergency response team and discuss their roles and responsibilities in the community.","dressed in swimwear long pants long sleeved shirt jumper shoes and socks, I can perform the following continuous sequence in a dam river or the ocean. - Dive and swim a distance underwater to simulate and escape from a sinking boat surrounded by oil. - Swim a further 40 metres freestyle as if escaping from a dangerous situation. - Remove shoes while treading water and then swim slowly 50 metres Breaststroke. - Float Survival skull or tread water for five minutes and wave one arm occasionally as if signalling for help. - Reassure any nearby candidates by talking to them. - Swim slowly for 100 metres using survival strokes changing strokes every 25 metres. - Remove clothing in deep water.","I have run a swimming and water safety activity for members of stage four or under at this stage.","I have been a part of two water rescue drills at this stage.","I have given a presentation to a group of scouts from earlier stages on a rescue activity I have completed.","I have demonstrated the correct maintenance of equipment following the conclusion of A rescue activity"]],[6,"Stage 6 — Surfing",["I can plan a surfing trip including equipment, food, transportation and surfing location.","I have taught a less experienced scout how to use their surfing equipment.","I can discuss tides currents and rips, and how this may impact on my surfing.","I know where I can find opportunities to further develop my surfing skills and knowledge.","I can perform the following skills while in shallow water (a depth of 1-1.5 metres) - Top and bottom turns - Cutbacks - Re entries","I always demonstrate knowledge of anticipated hazards safety procedures and appropriate behaviour while surfing.","I have undertaken at least eight days of surfing by the end of stage six.","I have given a presentation to a group of scouts from an earlier stage on a surfing activity I have completed.","I can demonstrate the correct maintenance of equipment following the conclusion of a surfing activity."]],[7,"Stage 7 — SCUBA",["I can explain the relative benefits of various types of equipment for diving.","I can care for my diving equipment and pack it for safe travel.","I know what items should be in a marine first aid kit for remote location travels as per state or territory regulations.","I have completed the Open Water Diver certification course or equivalent.","I have undertaken six additional dives after the Open Water Diver Certification Dive.","I can navigate with a compass underwater and understand the specific challenges of underwater navigation. (Currents lack of landmarks etc)","in conjunction with qualified instructors I have assisted with Scouts who were at stage four or five learning to snorkel in open water.","I can provide assistance to a tired diver on the surface and can share my air with a diver underwater.","I have performed two simulated rescues showing techniques of how to approach a panicked diver on the surface.","I have talked with scouts from earlier stages about my diving experience .","I can provide feedback to a patrol of scouts that I have led on a SCUBA trip on how we could improve in the future, considering risk management safety equipment management location selection level of difficulty teamwork etc"]],[7,"Stage 7 — Swiftwater Safety",["I know a basic management of suspected spinal injury in shallow water.","I understand the laws concerning acceptance of responsibility as a First Aider","I know how to use bystanders in an emergency situation.","I have completed a swift water safety half day worth of learning and drills.","I can swim 200 metres fully closed using a range of different strokes.","I have performed two simulated rescues showing techniques of how to avoid contact with violent patients and defence methods and releases where necessary.","I can recognise particular hazards in swiftly flowing water and identify appropriate actions and locations and formations where the danger is reduced.","I have led a group to demonstrate the huddle position and can explain the theory behind the H.E.L.P position.","I can demonstrate effective CPR in an outdoors water environment.","I can swim 400 metres continuously (consisting of 100 metres each of freestyle, backstroke, survival backstroke and side stroke) within 13 minutes.","I can swim 50 metres, then tow a patient 50 metres, within three minutes and 15 seconds.","I have demonstrated initiative in rescuing two people who are in difficulty up to 15 metres from safety.","I can provide feedback to a patrol of scouts that I have led on a water safety programme, on what we can improve on for the future."]],[7,"Stage 7 — Advanced Surfing",["I understand surf environments, including types of features of waves, the effect of wind, tide, and swell, and ocean floors on surface conditions and appropriate responses.","I can teach surfing etiquette to scouts at stage 4 about surfing safely alongside other surfers and swimmers.","I can source information about the local area to assist in the planning process and enable management of potential surfing hazards and any special restrictions applying to the area.","I can explain equipment types, characteristics and technology used for surfing, the advantages and disadvantages of the range of equipment and factors affecting appropriate selection of equipment.","I can perform the following skills while in shallow water. (Depth of 1-1.5 metres). - Roundhouse cut back - snap vertical re entry - tube riding - tail slides,","I have undertaken at least 15 days of surfing by the end of stage 7.","I can provide feedback to a patrol of scouts that I have let on a surfing trip on how we could improve in the future, considering risk management, safety, equipment management location selection, level of difficulty, teamwork, etc."]],[8,"Stage 8 — SCUBA",["I can teach another scout how to pack for a diving trip.","I have assisted in the planning of at least five open water dives.","I have assisted in the organisation of an instructional session to teach scouts in earlier stages, basic diving skills.","I have successfully completed the Wilderness First Aid skill set.","I have completed an advanced open water certification or equivalent.","I have completed a rescue diver certification or equivalent.","I have participated in a simulated scuba search and rescue.","I have three of the following experiences - I have short and underwater photo or video and understand the impacts of water on light. - I have either found or placed an underwater geocache. - I have dived at night. - I have performed basic repairs on my gear (replacing a mouthpiece with a spare etc) - I have participated in a marine environmental service project, cleaning up a body of water.","I have undertaken at least 25 dives by the end of stage 8.","I have mentored scouts at an earlier stage by demonstrating how to complete a log book entry for one of their snorkel or scuba trips.","I have mentored other Scouts by supporting them to experience aquatic adventures and understanding the benefits of completing a log book entry for their aquatic adventures."]],[8,"Stage 8 — Swiftwater Safety",["I can create a rescue plan with detailed risk management strategies for a more emergency with my group.","I know how to tether a craft to perform a rescue or recovery, where appropriate.","I have successfully completed the Wilderness first aid skill set.","I can perform a simulated rescue of someone caught in either a tidal rip or fast flowing river water.","I can identify and use a range of methods to release an entrapment victim according to the situation type of entrapment and organisational policies and procedures.","I can lead and communicate directions to other members of the rescue team.","I have been involved in water rescue drills which involve the use of mechanical haul systems.","I have completed and logged at least 5 water incidents reel or mock where I have been the lead first aider."]],[8,"Stage 8 — Advanced Surfing",["I can create a trip plan with detailed risk management strategies for an activity with my group.","I have successfully completed the Wilderness first aid skill set.","I can perform the following skills while in deep water (depth of over two metres) - top and bottom turns - cutbacks - re entries","I can demonstrate an airborne turn.","I have undertaken at least 22 days of surfing by the end of stage eight including five days while in stage 8.","I have participated in a marine environmental service project, cleaning up a body of water.","I have reviewed the Marine Environmental Service project that I participated in and have documented key points to be able to plan my own similar event."]],[9,"Stage 9 — SCUBA",["I can budget prepare and manage every aspect of an expedition.","I can develop a detailed risk management plan for a diving expedition.","I have drawn a map of a dive site.","I have kept my First Aid qualifications up to date.","I have assisted a dive master or equivalent in facilitating a less experienced, but qualified, group on a dive through a site that is new to the group.","I have completed a dive master or equivalent course.","I have assisted in leading scouts at stage seven with learning dive navigation or other advanced dive skills. (e.g a search and recovery dive.)","I have undertaken at least 50 scuba dives by the end of stage nine.","I have completed five specialty dives during stage 9.","I can evaluate aspects of a variety of dive types I have completed and describe the kinds of personal development and learning I achieved.","I have given a presentation to a group of scouts on the skills I have gained from completing the Aquatics Outdoor Adventure skills.","I have considered what I would like to do with the level of skill I have gained through the Aquatic Outdoor Adventure skills and discussed it with a trusted mentor."]],[9,"Stage 9 — Swiftwater Safety",["I know appropriate whitewater rescue techniques and common communication methods used among participants to reduce risk during activities.","I establish participants needs and characteristics to determine the sessions aims and objectives when facilitating a learning session.","I have kept my First Aid qualifications up to date.","I can plan instruct and monitor participant performance and response to maintain an effective learning environment.","I ensure that activities are conducted safely according to participants needs characteristics and teaching location","I apply effective contingency management techniques to deal with a range of problems and issues that may arise during the session such as equipment failure and make adjustments in response to changing situations.","I utilise sequential sessions that meet participant expectations comply with legislative and organisation requirements and are of sufficient duration to allow the participant to demonstrate water rescue skills at the desired level.","I can evaluate aspects of water safety training sessions I have completed and describe the kinds of personal development and learning I achieved.","I have given a presentation to a group of scouts on the skills I have gained from completing the Aquatics Outdoor Adventure skills.","I have considered what I would like to do with the level of skill I have gained through the Aquatic Outdoor Adventure skills and discussed it with a trusted mentor."]],[9,"Stage 9 — Advanced Surfing",["I can budget, prepare and manage every aspect of the expedition.","I can develop a detailed risk management plan for a surfing camp involving challenging but not dangerous conditions for a period of four days or more.","I know what equipment is required for surfing trips and the correct use and care of this equipment.","I have kept my First Aid qualifications up to date.","I can perform the following skills while in deep water (over 2 metres) - Roundhouse cut back - Snap vertical re-entry - Tube riding","I can demonstrate a 360 degree turn.","I have undertaken at least 35 days of surfing by the end of stage 9.","I can evaluate a variety of surfing experiences I have had and describe the kinds of personal development and learning I achieved.","I have given a presentation to a group of scouts on the skills I have gained from completing the Aquatics Outdoor Adventure skills."]]],"Boating":[[1,"Stage 1 — Introductory Skills",["I can dress myself for a boating trip.","I can explain the buddy system.","I know what a PFD is and why I have to wear one when on a boat.","I know how to stay with my buddy and the boat if it tips over.","I can take care of my equipment for the duration of a boating trip.","I can tie a reef knot.","I can swim 10 metres with a PFD.","I can explain the risks of exposure to weather.","I can get in and out of my watercraft safely.","I have taken part in a short boating adventure of at least one hour.","I can show where the bow and stern are on a boat.","I can talk about what I enjoyed by participating in a boating trip."]],[2,"Stage 2 — Basic Water Skills",["I can select the correct PFD for me.","I can put on an adjust my PFD.","I can discuss what safety precautions we should take before going out on the water.","I can explain the importance of wearing the right clothing and safety gear while boating.","I can describe four appropriate actions I should take if I capsize a sailboat or rowboat.","I know how to signal for help.","I can label a diagram describing all of the essential equipment required for boating activities.","I can tie a knot that will help me on a boating trip.","I can swim 25 metres wearing my PFD.","I can protect myself when exposed to the sun and other elements.","I can rig my boat with help and then practise getting into and out of my boat safely.","I have taken part in at least two boating trips at this Stage.","I can show you where I should sit in my boat and I know my role when I'm in the boat.","I can demonstrate how to clean down my boat before storing it.","I have talked about what I enjoyed, learned, or improved upon from at least two boating trips.","I can suggest what could be done differently on a future boating activity, to enjoy it more, to be safer, or to learn new things."]],[3,"Stage 3 — Basic Water Skills",["I know what DRSABCD stand for and how to use it in First Aid situations.","I can know what the risks are for boating in different weather conditions.","I have explained what impact I can have on the local environment when boating.","I know which personal items I should carry with me when boating.","I know how and where to get the latest weather forecast for the area I will be boating in.","I have discussed basic water safety while participating in boating activities as it applies to my State and Branch.","I can identify six types of naturally powered watercraft.","I have helped a low Stage Scout learn to put their PFD on.","I have learnt 3 knots that will help me in a boating situation.","I can name six different parts of a boat and or oar.","I know the difference between a tack and a gybe.","I have taken part in at least five boating trips by the end of Stage 3.","I can get back into my sailboat, rowboat or windsurfer from the water with help from someone else.","I can swim and demonstrate the HELP and huddle positions while in the water wearing a PFD.","I can swim 50 metres with my PFD on using any stroke.","I can teach the importance of the buddy system to a Scout in Stage 1.","I have discussed with my Patrol what I have learnt about boat safety from two boating trips"]],[4,"Stage 4 — Introductory Sailing",["I am familiar with the signs and symptoms of hypothermia and hyperthermia.","I ensure sufficient fluids are available for the duration of the activity.","I can read an itinerary for a proposed small sailing boat trip and understand what I am required to do.","I can identify the equipment I am required by law to have with me while boating.","I can prepare equipment, where required, for safe transportation to an activity location including the requirements to rig the boat.","I can name 15 different parts of a small sailboat what they do and what they are needed for.","I can explain how damaged centre boards can affect my sailing performance.","I have prepared my Patrol a small sailboat for towing on the water.","I have taken part in and logged at least two small sailboat trips at this Stage.","I have assisted to steer a small sailboat going upwind or downwind at this Stage.","I have learned a minimum of four sailing principles during Stage 4 and have demonstrated an understanding of them while on the water.","I have assisted with rigging a sail and can name three types of sails and the parts of those sails.","I have been part of a crew and can work the jib sheet under instruction.","I can interpret navigation Marks and know how to maintain a lookout.","I have taken part in a capsized training drill in deep water.","I have assisted with anchoring a small boat.","I have demonstrated methods to communicate effectively with other crew members.","I can identify where I have begun to improve my sailing skills and where I would like to further improve.","I have checked equipment for damage and discussed if it needs to be repaired or replaced."]],[4,"Stage 4 — Windsurfing",["I am familiar with the signs and symptoms of exposure.","I ensure sufficient fluids are available for the duration of the activity.","I can read an itinerary for a proposed windsurfing activity and understand what I am required to do.","I can identify the equipment I am required by law to have with me while windsurfing.","I can prepare equipment where required, for safe transportation to an activity location.","I know how the maintenance of a windsurfer needs to be conducted.","I can explain how damaged centre boards can affect my boating performance.","I can successfully uphaul the rig and maintain the V position for windsurfing","I can demonstrate how to steer a windsurfer going upwind or downwind.","I have taken part in and logged at least two windsurfing activities at this Stage.","I know how to adopt appropriate posture and balance when sailing a windsurfer.","I have demonstrated methods to communicate effectively with other windsurf sailors.","I can interpret marine navigation warnings to avoid incidences.","I can identify where I have begun to improve my windsurfing skills, and where I would like to further improve.","I have checked equipment for damage and discussed if it needs to be repaired or replaced."]],[5,"Stage 5 — Introductory Sailing",["I know how to identify food and water requirements for day trips.","I can select routes that minimise damage to the environment.","I can identify possible hazards associated with sailing and procedures I can take to minimise the risks.","I have planned a date of small boat sailing taking into consideration all personal and Group equipment and all requirements for the trip.","I have learned another two knots since completing Stage 3 that will help me while sailing and have assisted a Stage 3 Scout in learning their knots.","I have successfully completed a Provide First Aid (including CPR) course from a recognised provider","I can steer my small Sailcraft to come alongside another object and can make a jetty or beach approach.","I have steered a small Sailcraft on all points of sailing.","I have helped a Stage two or three Scout explain the basic safety rules for being near water.","I have reefed a sail, sailed with a reefed sail and take it out a reef.","I have created and used a float plan.","I can explain the collision regulations for sailing.","I can steer a crewed rowing boat using the correct rowing orders - or - I have demonstrated steering a sailboat upwind, bearing off, reaching and going downwind.","I can perform controlled gybes while sailing downwind and know how to avoid unexpected gybes.","I can explain local weather patterns and signs of bad weather.","I can load a boat with crew and equipment and trim it correctly.","I have demonstrated competence at all roles on board.","I have demonstrated proper Man Over Board (MOB) procedures while on the water.","I have demonstrated an ability to set the sails using tell tales and leech tails to respond to wind conditions.","I have undertaken at least five days of sailing on safe familiar waters by the end of Stage 5.","I have assisted with basic boat maintenance tasks.","I can manoeuvre the sailboat properly when giving the proper commands to the crew.","I have participated in a sailboat towing situation.","I have helped my crew to understand the importance of looking after the boat and rigging, including washing and storing the sails appropriately.","I have discussed with my crew what we did well and what we could learn from, to enhance the next sailing trip."]],[5,"Stage 5 — Windsurfing",["I know how to identify food and water requirements for windsurfing activities.","I can select windsurfing activity routes that minimise damage to the environment.","I can identify possible hazards associated with windsurfing and procedures to minimise risks and I know how to take actions to minimise these risks.","I have successfully completed a Provide First Aid (including CPR) course from a recognised provider","I have helped a Stage2 or 3 Scout explain the basic safety rules for being near water.","I know how to create and use a float plan for a windsurfing activity.","I can explain the rules established to avoid collision.","I can inspect a rigged windsurfer and identify faulty parts.","I have demonstrated steering a windsurfer heading upwind, or bearing off and going downwind, depending on wind conditions and direction.","I can demonstrate a self rescue with my windsurfer.","I have undertaken at least five days of windsurfers sailing on safe familiar waters by the end of Stage 5.","I can manoeuvre a windsurfer around a triangular course.","I can review my own windsurfing performance and identify potential improvements.","I am aware of what to do in the event of an incident whilst windsurfing."]],[6,"Stage 6 — Intermediate Sailing",["I understand and have taken the appropriate actions to maintain hydration.","I understand, and can explain, air dynamics on a sail.","I can evaluate local sailing hazards and plan accordingly.","I can explain what a dead run is and the signs that it is occurring.","I understand the use of a trapeze in the context of sailing.","I can give a safety briefing to a new crew before sailing.","I have looked through my float plan from Stage 5 and have adjusted it to lead later in this Stage.","I can clearly communicate with my crew to trim the sails and balance the boat on all points of sailing.","I can clearly communicate with my crew to synchronise the helm to sail trim and to boat balance.","I can inspect a rigged sailboat and identify faulty parts, repairing or replacing items as needed.","I have participated in Sailing amount course or competitive sail day.","I have used communication devices to communicate with a home party on land.","I have sailed on a compass bearing.","I have participated in a simulated MOB exercise and have learnt two methods to recover a person from the water.","I have undertaken at least eight days of sailing.","I have led a day sail with a small Patrol with a supervision of a Stage 8 Scout or above.","I can measure distances and plot a safe route on a chart, and determine the true bearing to steer.","I understand spinnaker setting and retrieval techniques.","I have looked through my float plan from Stage 5 and have adjusted it taking into account what I know from my recent sailing experiences.","I have given a presentation to a Group of Scouts in Stage four or lower on a sailing activity I have completed.","I can demonstrate the correct maintenance of Scout Group Scout Centre Borrowed or my own sailing gear following the conclusion of a sailing activity."]],[6,"Stage 6 — Windsurfing",["I have and can demonstrate a full understanding of local racing rules.","I understand and have taken the appropriate actions to maintain hydration.","I understand and can explain air dynamics on a sail.","I can evaluate local sailing hazards.","I can sail all points of sailing on a windsurfer in a variety of conditions, knowing where to tack and gybe, using a harness and a beach start.","I have demonstrated a proper steering techniques in stronger winds.","I have participated in a Windsurfer rescue as both the rescuer and the one being rescued.","I have undertaken at least 10 days of sailing by the end of Stage six.","I have given a presentation to a Group of Scouts in Stage four or lower on a windsurfing activity I have completed.","I can demonstrate the correct maintenance of windsurfing equipment following the conclusion of a windsurfing activity."]],[7,"Stage 7 — Intermediate Sailing",["I have completed Stage five of the three core Outdoor Adventure Skills.","with my Patrol I have developed a hazard assessment and Risk control plan detailing how we will deal with injuries illness loss of equipment and other potential emergencies on our trip.","I have identified situations in which a spinnaker can be used.","I can describe the mechanics of air flow over the sail.","I can describe how to tune a sailboat.","I can evaluate geographical and tidal effects of sailing locations.","I have set up communication channels with other craft.","I have rigged a spinnaker with the crew and have sailed with it in light to moderate conditions.","I have sailed on a trapeze in moderate conditions.","I have steered a craft including Tech and gybe with a crew on a trapeze.","I can pick up a tow and manage the boat under tow.","I can allow for variation, deviation, set and drift in setting a course.","I can identify lighthouse and beacon information on a chart.","I have sailed in a keel boat and can perform all roles on board.","I understand the racing rules for sailing.","I know the safe use and care of emergency equipment.","I have participated in a one or two day local regatta.","I have participated in an overnight sailing trip.","I have assisted a Stage 5 Scout or below with three of their requirements.","I have made three different splices at this Stage for use on a boat.","I have undertaken at least 15 days of sailing at the completion of Stage 7.","I have facilitated a debrief session for a sailing trip I have led at this Stage, including positive affirmations of crew members contributions and offering feedback on areas for improvement."]],[7,"Stage 7 — Advanced Windsurfing",["with my team, I have developed a hazard assessment and risk control plan detailing how we will deal with injuries illness loss of equipment and other potential emergencies on our trip.","I can describe the difference between different types of windsurfing boards, their uses and limitations.","I can describe how to tune a fully battened sail windsurfer","I can evaluate geographical and tidal effects of a sailing venue.","I know and can describe the intent of the current ISAF Racing rules 1-7.","I have demonstrated an understanding of windsurfer rigging including the advantages and disadvantages of the various types of sails.","I have demonstrated the skills to balance the windsurfer while under way on the water.","I have successfully shown how to manoeuvre while sailing a windsurfer in stronger winds.","I have demonstrated an ability to tack in stronger winds whilst maintaining speed, gybe with both the centreboard down and up and maintain a stationary position near A marker in moderate winds.","I have demonstrated tactical manoeuvres while racing a Windsor including tacking on shifts and looking for gusts.","I have undertaken at least 15 days of sailing by the end of Stage seven.","I can provide feedback to a Patrol of Scouts that I have led on a windsurfing activity on what we can improve on for the future considering risk management safety location selection level of difficulty and so on"]],[8,"Stage 8 — Advanced Sailing",["I can teach proper etiquette for using a marine radio on the water.","I have obtained the correct licence for a marine radio if required.","I can evaluate meteorological and tidal effects of a new sailing location.","I can anticipate variable winds in a marine environment.","I can plan for a minimum of two night, 3 day sailing journey for a Patrol of four or more looking after all pre requirements.","I have organised and run a one to two day sailing regatta.","I have demonstrated role tacking and gybe manoeuvres in changing conditions.","I understand the use of drogues.","I have taught three different MOB recovery methods to a Stage 7 Scout or lower.","I have demonstrated various methods to launch and retrieve a spinnaker on different sized vessels.","I have undertaken at least 20 days of sailing, including some days in breezes of over 20 knots and at least one overnight sail.","I have successfully completed the Wilderness First Aid skill set.","I have demonstrated competence at boat maintenance tasks with safe use of tools paints and resins.","I have helped review the boat Maintenance and training programme at my Scout Group or Scout Sailing Centre and have taken part in implementing Improvements."]],[8,"Stage 8 — Advanced Windsurfing",["I know the collision regulations on the water.","I know how to properly prepare my windsurfer for safe travel to and from an activity.","I can evaluate meteorological and tidal effects of a new sailing venue.","I know and can describe the current racing rules.","I have demonstrated how to tune windsurfer.","I have demonstrated optimal body position at all times when sailing a sailboard successfully in moderate to stronger winds.","I have demonstrated tacking and gybe manoeuvres.","I can demonstrate tactics while racing a windsurfer for slalom and wave sailing contests.","I've demonstrated the racing strategies for windsurfing.","I have undertaken at least 22 days of sailing by the end of Stage eight.","I have successfully completed the Wilderness First Aid skill set.","I can provide basic construction and feedback to a Patrol of Scouts that I have led on a windsurfing activity helping participants to improve their windsurfing technique."]],[9,"Stage 9 — Advanced Sailing",["I have kept my First Aid qualifications up to date.","I have developed a passage plan based on wind geography tides and currents prior to a sail.","I have a full understanding of Airflow over sails, and has successfully taught the principles of sail trim and helming a small boat to Stage six Scouts.","I have the knowledge to effectively evaluate and adjust both standing and running rigging to improve safety and performance.","I have undertaken at least 30 days of sailing.","I have participated in sailing with a Spinnaker kit.","I have led a sailing journey of two nights, three days or more including some nights sailing as the responsible activity leader.","I have demonstrated my personal development in sailing by one of the following means or similar standard activity after discussion with my section Council: - Take up a crew position on a multi day ocean race or cruising voyage. - Take part in a full yacht racing season with a local Yacht Club. - Take a leading part in sailing training for 12 months at a Scout Group or Scout Sailing centre. - Gain an instructor's certificate from Sailing Australia and use it to advance sail training at a Scout Group or Scout Sailing Centre.","I have given a presentation to a Group of Scouts on the skills I have gained from completing the Boating Outdoor Adventure Skills.","I have considered what I would like to do with the level of skill I have gained through the Boating Outdoor Adventure Skills and discussed it with a trusted mentor."]],[9,"Stage 9 — Advanced Windsurfing",["I have kept my First Aid qualifications up to date.","I have developed strategic and tactical plans based on wind geography tides and currents prior to a race.","I've prepared the vehicle and or trailer with the windsurfer loaded that I am responsible for prior to travelling to any events.","I have used precautionary driving skills while travelling safely to events carrying passengers and or transporting windsurfers.","I have a full understanding of airflows over the sails, and can explain the advantages of rotational and camber induced sails.","I can demonstrate an effective launching and beach starting of a windsurfer.","I can demonstrate a water start of a windsurfer.","I can effectively sail a windsurfer through small breaking waves.","I can effectively luff up and bear away a windsurfer with the correct mast track and centreboard adjustments.","I can effectively sail a windsurfer backwards from a set line.","I understand the emergency action required with a windsurfer with a broken fin, universal mast and boom.","I have undertaken at least 35 days of sailing by the end of Stage nine.","I have given a presentation to a Group of Scouts on the skills I have gained from completing the Boating Outdoor Adventure Skills."]]],"Paddling":[[1,"Stage 1",["I can explain what a PFD is for.","I can dress myself for a paddling trip.","I can explain the buddy system.","I can swim 10 metres with a PFD.","I can float with my PFD for two minutes.","I can explain basic risks of cold water.","I know what a forward and backward stroke are.","I can demonstrate the forward and backward stroke.","I have taken part in a short paddling adventure of at least one hour.","I can take care of my equipment for the duration of a paddling trip.","I can show where the bow and stern are in a canoe or kayak.","I can talk about what I enjoyed by participating in a paddling trip."]],[2,"Stage 2",["I can put on an adjust my PFD.","I have explained some of the ways that I could have an impact on the environment where I am paddling.","I can list the appropriate action I should take if I capsize in a canoe or kayak.","I can discuss what safety precautions you should take before going out on the water.","I know how to contact the emergency services.","I can draw and label a diagram describing all of the essential equipment required for paddling activities.","I have learned 1 knot that will help me in a paddling situation.","I have learned about two other strokes.","I can swim 25 metres wearing my PFD.","I can protect myself when exposed to the sun while outdoors on a paddling trip.","I know what to do when lost on the water.","I can demonstrate a forward and backward stroke and paddle in a straight line.","With help from my team, other Scouts, or my Leader, I can paddle my canoe or kayak for the duration of a paddling trip.","I have taken part in at least two paddling activities at this Stage.","I can name the important parts of a canoe or kayak.","Before I launch my watercraft, I can show where I am allowed to go paddling.","I can demonstrate how to clean down my watercraft before storing it.","I have talked about what I enjoyed, learned, or improved upon from at least three paddling trips.","I can suggest what could be done differently on a future paddling activity, to enjoy it more, to be safer, or to learn new things."]],[3,"Stage 3",["I know what the risks are for paddling in different weather conditions.","I can explain the importance of wearing the right clothing and gear while paddling.","I know which items I should carry with me when paddling.","I know how and where to get the latest weather forecast for the area I will be paddling in.","I have learnt an additional stroke to assist with my paddling.","I can identify two different types of rescue techniques for a boat that has capsized.","I know different forms of communication to use between paddlers while on the water.","I can identify common waterways markers.","I know what DRSABCD stand for and how to use it in First Aid situations.","I can get in and out of my watercraft safely.","I can secure my watercraft on the shore.","I know how to choose a paddle that is the correct size.","I have helped a Stage 1 paddler learn to put their PFD on.","I have taken part in at least two paddling activities at this Stage.","I can paddle my watercraft in the direction of travel whether straight or around objects and shorelines.","I have been a part of a raft-up drill on the water and can explain its uses.","I have capsized a canoe while sitting in it.","I can get back into my canoe or kayak with help from someone in another watercraft if my watercraft capsized.","I can swim 50 metres with my PFD on using any stroke.","I can teach the importance of the buddy system to a less experienced Scout.","I have discussed with my Patrol what I have learned about paddling safety from two paddling trips."]],[4,"Stage 4 — Introductory Canoe",["I have helped a Stage two paddler to explain the basic safety rules for being near water.","I can read an itinerary for a proposed canoeing trip and understand what I am required to do.","I can explain how canoes and paddles can be damaged.","I can identify the equipment I am required, by law, to have with me while canoeing.","I can prepare equipment, where required, for safe transportation to an activity location.","I have learnt a knot that will help me in a paddling rescue situation.","I understand how to keep a Group together while canoeing.","I can point out where the systems are dangerous when paddling.","I can swim and demonstrate the HELP and huddle positions while in the water wearing a PFD.","I am familiar with the signs and symptoms of hypothermia and hyperthermia","I can trade places with my canoeing partner while on the water staying in our watercraft.","I have taken part in and logged at least 2 canoes activities at this Stage.","I can demonstrate how to plan a day trip using a map or a chart of the area.","I can demonstrate basic canoe strokes (e.g. forward, reverse, draw, stop and sweep).","I can launch my canoe in a controlled manner and maintain balance.","I can identify where I have begun to improve my canoeing skills, and where I would like to further improve.","I have checked equipment for damage and discussed if it needs to be repaired or replaced."]],[4,"Stage 4 — Introductory Kayak",["I have helped a Stage two paddler to explain the basic safety rules for being near water.","I can read an itinerary for a proposed kayaking trip and understand what I am required to do.","I can explain how kayaks and paddles can be damaged.","I can identify the equipment I am required, by law, to have with me while kayaking.","I can prepare equipment, where required, for safe transportation to an activity location.","I have learnt a knot that will help me in a paddling rescue situation.","I understand how to keep a Group together while kayaking.","I can point out where the systems are dangerous when paddling.","I can swim and demonstrate the HELP and huddle positions while in the water wearing a PFD.","I am familiar with the signs and symptoms of hypothermia and hyperthermia","I can stand up in my kayak and trade kayaks with someone else without getting in the water.","I have taken part in and logged at least 2 kayaking activities at this Stage.","I can demonstrate how to plan a day trip using a map or a chart of the area.","I can demonstrate basic kayak strokes (e.g. forward, reverse, draw, sweep and rudder).","I can launch my kayak in a controlled manner and maintain balance.","I can identify where I have begun to improve my kayaking skills, and where I would like to further improve.","I have checked equipment for damage and discussed if it needs to be repaired or replaced."]],[4,"Stage 4 — Introductory Sea Kayak",["I have helped a Stage two paddler to explain the basic safety rules for being near water.","I can read an itinerary for a proposed sea kayaking trip and understand what I am required to do.","I can explain how kayaks and paddles can be damaged.","I can identify the equipment I am required, by law, to have with me while sea kayaking.","I can prepare equipment, where required, for safe transportation to an activity location.","I have learnt a knot that will help me in a paddling rescue situation.","I understand how to keep a Group together while sea kayaking.","I can point out where the systems are dangerous when paddling.","I can swim and demonstrate the HELP and huddle positions while in the water wearing a PFD, away from shore at the beach or in an open body of salt water.","I am familiar with the signs and symptoms of hypothermia and hyperthermia","I can stand up in my kayak and trade kayaks with someone else without getting in the water.","I have taken part in and logged at least 2 sea kayaking activities at this Stage.","I can demonstrate how to plan a day trip using a map or a chart of the area.","I can demonstrate basic kayak strokes (e.g. forward, reverse, draw, sweep and rudder).","I can demonstrate using a rudder while kayaking or rudder stroke.","I can launch my sea kayak in a controlled manner and maintain balance.","I can identify where I have begun to improve my sea kayaking skills, and where I would like to further improve.","I have checked equipment for damage and discussed if it needs to be repaired or replaced."]],[5,"Stage 5 — Introductory Canoe",["I know how to identify food and water requirements for multi day trips.","I can select routes that minimise damage to the environment.","I can identify possible hazards associated with canoeing and procedures to minimise risks and I know how to take actions to minimise these risks.","I know where to source information about canoe selection.","I have a basic waterways knowledge (e.g. tides, eddies, flow)","I can identify different waterways markers.","I know where to find waterways regulations and can point out two things I didn't already know when participating in watercraft activities.","I know what safety and communications equipment I should have with me while on a paddling journey and can demonstrate their uses.","I have successfully completed a Provide First Aid (including CPR) course from a recognised provider","I have participated in at least one 2-day canoeing trip.","I can demonstrate a self rescue with my canoe to a Stage three Scout or below.","I condemn straight I self rescue with my canoe to a Stage three Scout or below.","I have participated in a canoe-over-canoe rescue as both a rescuer and the one being rescued.","I can assist Stage three paddlers to get back into their swamped watercraft.","I can help paddlers at Stage three or below identify the parts of their paddle and their canoe.","I have participated in being towed in my canoe.","I can use all of my previously learnt strokes and can demonstrate a J-stroke and support strokes for canoeing.","I have notified the relevant authority of trip completion.","I can review my own canoeing performance and identify potential improvements."]],[5,"Stage 5 — Introductory Kayak",["I know how to identify food and water requirements for multi day trips.","I can select routes that minimise damage to the environment.","I can identify possible hazards associated with kayaking and procedures to minimise risks and I know how to take actions to minimise these risks.","I know where to source information about kayaking selection.","I have a basic waterways knowledge (e.g. tides, eddies, flow)","I can identify different waterways markers.","I know where to find waterways regulations and can point out two things I didn't already know when participating in watercraft activities.","I can identify the use for a kayak role and can name two different versions.","I know what safety and communications equipment I should have with me while on a paddling journey and can demonstrate their uses.","I have successfully completed a Provide First Aid (including CPR) course from a recognised provider","I have participated in at least one 2 day kayaking trip.","I have helped prepare an emergency plan and a flight plan with a more experienced kayaker for a trip.","I can demonstrate a self rescue with my kayak to a Stage three or below Scout.","I can apply deep water reentry techniques.","I can assist Stage three paddlers to get back into their swamped watercraft.","I can help paddlers at Stage three or below identify the parts of their paddle and their kayak.","I have participated in being towed in my kayak.","I can use all of my previously learnt strokes and can demonstrate a rudder and support strokes for kayaking.","I have notified the relevant authority of trip completion.","I can review my own kayaking performance and identify potential improvements."]],[5,"Stage 5 — Introductory Sea Kayak",["I know how to identify food and water requirements for multi day trips.","I can select routes that minimise damage to the environment.","I can identify possible hazards associated with sea kayaking and procedures to minimise risks and I know how to take actions to minimise these risks.","I know where to source information about sea kayak selection","I have basic waterways knowledge (e.g tides, eddies, flow)","I can identify different waterways markers.","I know where to find waterways regulations and can point out two things I didn't already know when participating in watercraft activities.","I can identify the use for a kayak role and can name two different versions.","I know what safety and communications equipment I should have with me while on a paddling journey and can demonstrate their uses.","I have successfully completed a provide First Aid (including CPR) course from a recognised provider.","I've participated in at least one 2 day sea kayaking trip.","I have helped prepare an emergency plan and a float plan with a more experienced sea kayaker for a trip.","I can demonstrate a self rescue with my sea kayak.","I can apply deep water re entry techniques.","I can assist Stage three paddlers to get back into their swamped watercraft.","I can help paddlers at Stage two identify the parts of their paddle and their kayak.","I have participated in being towed in my kayak.","I can use all my previously learnt strokes and can use support strokes for kayaking.","I have notified the relevant authority of trip completion.","I can review my own sea kayaking performance and identify potential improvements."]],[6,"Stage 6 — Intermediate Canoe",["I have completed Stage five of three core Outdoor Adventure Skills.","I can teach another youth what to pack for a weekend canoeing trip.","I can check our equipment against the needs of the Group before commencing a trip.","I can plan and lead an overnight canoeing trip.","I can help organise the transportation required for an activity.","with my canoeing team I can plan a healthy menu for our canoe adventure and help prepare the meals we have planned.","I can use a topographical map and A compass to tell where I am and where I am going while on a canoe trip.","I know how to waterproof equipment for a canoe trip.","I understand the dangers associated with towing another canoe.","I know how to find out the remote camping regulations in the area where I will be travelling.","I can explain how to deal with waste while travelling in a remote location, including grey water, solid waste,food scraps and human waste.","I have led water rescue drills in an area in which the participants cannot stand.","I can teach a Stage 4 Scout or below the importance of keeping a Group together while on a canoe trip.","I can recognise conditions that may precede bad weather while on a canoe trip.","I have taught at least one canoeing skill. One canoeing safety element and one canoeing knowledge item to paddlers working on Stages 1-4 at this Stage.","I have learnt two new strokes/canoeing skills at this Stage.","I have undertaken at least 10 days of paddling by the end of Stage 6.","I can explain how I can access emergency assistance while in a remote location.","I have completed at least one canoeing trip that goes for, at a minimum, two nights and 40 kilometres.","I have given a presentation to a Group of Scouts in Stage four or lower on a canoeing activity I have completed.","I can demonstrate the correct maintenance of equipment following the conclusion of a canoeing activity."]],[6,"Stage 6 — Intermediate Kayak",["I have completed Stage five of the three core Outdoor Adventure Skills.","I can teach another Scout what to pack for a weekend kayaking trip.","I can check our equipment against the needs of the Group before commencing a trip.","I can plan and lead an overnight kayaking trip.","I have learnt two new strokes or kayaking skills at this Stage.","I can help organise the transportation required for an activity.","With my kayaking team, I can plan a healthy menu for our kayak adventure and help prepare the meals we have planned.","I can use a topographical map and A compass to tell where I am and where I am going while on a kayak trip","I know how to find out the remote camping regulations in the area where I will be travelling.","I can explain how to deal with waste while travelling in a remote location, including grey water, solid waste, food scraps and human waste.","I have led water rescue drills in an area in which the participants cannot stand.","I have practised kayak roles in a flat water environment.","I can teach a Stage 4 Scout or below the importance of keeping a Group together while on a kayak trip.","I can recognise conditions that may precede bad weather while on a kayaking trip.","I have taught at least one kayaking skill, one kayaking safety element, and one kayaking knowledge item to paddlers working on Stages 1-4 at this Stage.","I have undertaken at least 10 days of paddling by the end of Stage 6.","I can explain how I can access emergency assistance while in a remote location.","I have completed at least one kayaking trip that goes for a minimum of two nights and 40 KMS.","I have given a presentation to a Group of Scouts in Stage four or lower on a kayaking activity I have completed.","I can demonstrate the correct maintenance of equipment following the conclusion of a kayaking activity."]],[6,"Stage 6 — Intermediate Sea Kayak",["I have completed Stage five of the three core Outdoor Adventure Skills.","I can teach another Scout what to pack for a weekend sea kayaking trip.","I can check our equipment against the need of the Group before commencing a trip.","I have learned two new strokes/kayaking skills at this Stage.","I can plan and lead an overnight sea kayaking trip.","I can help organise the transportation required for an activity.","with my sea kayaking team I can plan a healthy menu for our sea kayak adventure and help prepare the meals we have planned.","I can use and understand a topographical map and a compass to tell where I am and where I am going while on a sea kayaking trip.","I have researched and can present how weather in a marine environment can be affected by the relation between land and water.","I know how to find out the remote camping regulations in the area where I will be travelling.","I can explain how to deal with waste while travelling in a remote location, including grey water, solid waste, food scraps and human waste.","I have led water rescue drills in a sea kayaking environment.","I have practised kayak rolls in a flat water environment.","I can teach a Stage 4 Scout or below the importance of keeping a Group together while in a sea kayak environment.","I can recognise conditions that may precede bad weather in a marine environment.","I have taught at least one sea kayaking skill, one sea kayaking safety element and one sea kayaking knowledge item to paddlers working on Stages 1-4 at this Stage.","I have undertaken at least 10 days of paddling by the end of Stage 6.","I can explain how I can access emergency assistance while in a remote location.","I have given a presentation to a Group of Scouts in Stage four or lower on a sea kayaking activity I have completed.","I can demonstrate the correct maintenance of equipment following the conclusion of a sea kayaking activity."]],[7,"Stage 7 — Intermediate White Water Canoe",["I can pack for a white water canoeing trip.","I can assess risk and be aware of Group safety.","I have been part of a team to develop a hazard assessment and risk control plan detailing how we will deal with injuries illness loss of equipment and other potential emergencies on our trip.","I can explain the relative benefits of various types of canoe materials and designs.","I always wear an approved paddling helmet when I canoe in Rapids.","I know the application of a throw bag in white water situations.","I know what items of safety and rescue equipment I need for a white water paddling trip.","I know what items should be in a First Aid kit for remote location white Water paddling.","I understand the basic principles of a white water rescue (reach, throw, row,tow, go)","I know and follow my local state or territory laws for the requirements for guided whitewater trips.","I can efficiently and safely port my canoe around a rapid.","I can launch my canoe in a safe manner in moving water.","I know how to prepare a canoe for safety and comfort.","I can show you how and why. The way I load my canoe will be different for different water conditions.","I can demonstrate three different white water killing skills.","I can Scout a rapid ahead and determine safe and unsafe paddle lines.","I can demonstrate defensive swimming. To actively avoid hazards.","I can demonstrate rescuing and re entering my canoe in a white water situation.","I can demonstrate cutting into an Eddy in slow to medium flowing water.","I have participated in three days of white water paddling at this Stage in grade 2 water.","I can provide feedback to a Patrol of Scouts that I have led on a canoe trip on what we can improve on for the future considering risk management safety location selection level of difficulty equipment management, etc"]],[7,"Stage 7 — Intermediate White Water Kayak",["I can pack for a kayaking trip.","I can assess risk and be aware of Group safety.","I can explain the relative benefits of various types of kayaking materials and designs.","I have been part of a team to develop a hazard assessment and risk control plan, detailing how we will deal with injuries, illness, loss of equipment and other potential emergencies on our trip.","I always wear an approved paddling helmet when I kayak in Rapids.","I know the application of a throw bag in white water situations.","I know what items of safety and rescue equipment I need for a white water paddling trip.","I know what items should be in a First Aid kit for remote location white water paddling.","I understand the basic principles of a white water rescue (reach, throw, row, tow, go)","I know and follow my local state or territory laws for the requirements for guided white water trips.","I can show you how and why. The way I load my kayak will be different for different water conditions.","I can launch my kayak in a safe manner, in moving water.","I can efficiently and safely port my kayak around a rapid.","I know how to prepare a kayak for safety and comfort.","I can demonstrate three different white water kayaking skills.","I can Scout a rapid ahead and determine safe and unsafe paddle lines.","I can demonstrate defensive swimming. To actively avoid hazards.","I can demonstrate rescuing and re entering my kayak in a white water situation.","I have participated in three days of white water paddling. At this Stage in grade 2 water.","I can demonstrate a kayak roll in a grade two rapid.","I can provide feedback to a Patrol of Scouts that I have led on a kayaking trip on what we can improve on for the future considering risk management safety location selection level of difficulty equipment management, etc"]],[7,"Stage 7 — Intermediate White Water Rafting",["I could explain the relative benefits of various types of rafting materials and designs.","I always wear an approved paddling helmet when I paddle in Rapids.","I can pack for a white water rafting trip.","I can assess risk and be aware of Group safety.","I have been part of a team to develop a hazard assessment and risk control plan detailing how we will deal with injuries, illness, loss of equipment and other potential emergencies on our trip.","I know the application of a throw bag in whitewater situations.","I know what items of safety and rescue equipment I need for a white water rafting trip.","I know what items should be in a First Aid kit for remote location while white water rafting.","I understand the basic principles of whitewater rescue (reach throw, row, tow, go)","I know and follow my local state or territory laws for the requirements for guided whitewater trips.","I can efficiently and safely port my raft around a rapid.","I know how to prepare a raft for safety and comfort.","I can show you how and why the way I load my raft will be different for different water conditions.","I can demonstrate three different white water raft skills with a team.","I can Scout a rapid ahead and determine safe and unsafe paddle lines and communicate this to the rafting crew.","I can demonstrate   let litPath='';

    for(let i=1;i<=climbAt;i++){const a=MTN_PTS[i-1],b=MTN_PTS[i];

  const cp=climbAt<0?[MTN_PTS[0][0],MTN_PTS[0][1]+16]:[MTN_PTS[climbAt][0],MTN_PTS[climbAt][1]-15];

      ${nodes}${flag}

function oasFor(sid){
  const done=new Set();
  S.nights.forEach(n=>{const v=(n.skillsDone||{})[sid];
    (Array.isArray(v)?v:Object.keys(v||{})).forEach(id=>done.add(id)); });
  const s=S.roster.find(x=>x.id===sid)||{};
  const start=s.oasStart||{};
  const out={streams:{},prog:0,cores:0};
  Object.keys(OAS_SKILLS).forEach(st=>{
    const from=+(start[st]||0);let cur=from;
    for(let stage=from+1;stage<=9;stage++){
      const groups=OAS_SKILLS[st].filter(g=>g[0]===stage);
      const ok=groups.some(g=>g[2].every((x,i)=>done.has(st+'|'+OAS_SKILLS[st].indexOf(g)+'|'+i)));
      if(ok)cur=stage;else break;}
    out.streams[st]={from,cur};
    out.prog+=Math.max(0,cur-from);
    if(cur>=4)out.high=(out.high||0)+1;
    if(['Bushcraft','Bushwalking','Camping'].includes(st)&&cur>=5)out.cores++;});
  out.high=out.high||0;
  const q=reqs(s.section);
  out.done=out.prog>=q.oasProg&&out.cores>=q.oasCores&&(!q.oasHigh||out.high>=q.oasHigh);
  return out;}
/* --- earned-skill helpers: what a scout already has, from ticked nights + arrival stage --- */
function earnedSkillIds(sid){
  const out=new Set();
  S.nights.forEach(n=>{const v=(n.skillsDone||{})[sid];
    (Array.isArray(v)?v:Object.keys(v||{})).forEach(id=>out.add(id));});
  return out;}
function hasSkillAlready(s,skid,earned){
  if(earned&&earned.has(skid))return true;
  const p=skid.split('|');const grp=OAS_SKILLS[p[0]]&&OAS_SKILLS[p[0]][+p[1]];
  const st=+((s&&s.oasStart&&s.oasStart[p[0]])||0);
  return !!grp&&grp[0]<=st;}
/* Nearest next stage per stream — which group has the fewest skills left */
function oasNextUp(s){
  const earned=earnedSkillIds(s.id);
  const o=oasFor(s.id);const out=[];
  STREAMS.forEach(st=>{
    const v=o.streams[st];const next=((v&&v.cur)||0)+1;if(next>9)return;
    // skip the stage 6-9 placeholders — those are assessor sign-offs, not skills to plan a night around
    const groups=OAS_SKILLS[st].filter(g=>g[0]===next&&!(g[2].length===1&&/^Stage \d+ requirements met/.test(g[2][0])));
    if(!groups.length)return;
    let best=null;
    groups.forEach(g=>{const gi=OAS_SKILLS[st].indexOf(g);
      const left=g[2].map((sk,i)=>({i,sk})).filter(x=>!hasSkillAlready(s,st+'|'+gi+'|'+x.i,earned));
      if(!best||left.length<best.left.length)best={st,stage:next,label:g[1],left};});
    if(best&&best.left.length)out.push(best);});
  return out.sort((a,b)=>a.left.length-b.left.length);}
/* What the current milestone still needs, in words */
function msNeeds(id){
  const r=msRollup(id);const tg=MS[r.cur],f=r.progress;const parts=[];
  AREAS.forEach(a=>{const d=tg.P-(f[a]||0);if(d>0)parts.push((a==='Personal Growth'?'Growth':a)+' '+d);});
  const dA=tg.A-(f.A||0);if(dA>0)parts.push(dA+' assist'+(dA>1?'s':''));
  const dL=tg.L-(f.L||0);if(dL>0)parts.push(dL+' lead'+(dL>1?'s':''));
  return parts;}
function msDoneCalc(s){
  // M1..M3 done flags come straight from the roll-up: a milestone is done when
  // the pooled counts fill its full target. Overflow rolls into the next.
  return msRollup(s.id).done;}
// Peak Award step indices: 0,1 = intros (manual); 2,3,4 = M1,M2,M3 (auto);
// 5 = OAS (auto); 6 = SIAs (auto); 7,8,9 = journey,course,reflection (manual).
const PEAK_AUTO=[2,3,4,5,6];
// Effective 10-step done array: manual steps come from stored peakSteps,
// auto steps are computed fresh from the ledger every time (never stored).
/* Finished = has a completion date, or came from the workbook already earned
   (no start date recorded). Only SIAs started via "Planned" sit in progress. */
function siaFinished(s){return (s.sias||[]).filter(x=>x.date||!x.started);}
function peakStepState(s){
  const stored=s.peakSteps||TEN_F.slice();
  const md=msDoneCalc(s);const o=oasFor(s.id);
  const fin=siaFinished(s);
  const out=stored.slice();
  out[2]=md[0];out[3]=md[1];out[4]=md[2];
  const q=reqs(s.section);
  const areaN=new Set(fin.map(x=>x.area).filter(Boolean)).size;
  out[5]=o.done;out[6]=fin.length>=6&&areaN>=q.siaAreas;
  const j=s.journey||{};
  out[7]=stored[7]||!!(j.planDate&&j.doDate&&j.reviewDate);
  return out;}
function rosterDefaults(){
  S.roster.forEach(s=>{if(!s.sias)s.sias=[];if(s.priorKm==null)s.priorKm=0;if(s.priorNights==null)s.priorNights=0;if(s.memberNo==null)s.memberNo="";
    if(!s.peakSteps)s.peakSteps=TEN_F.slice();
    else if(s.peakSteps.length===7){const o=s.peakSteps;
      s.peakSteps=[false,false,o[0],o[1],o[2],o[3],o[4],o[5],o[6],false];}
    else while(s.peakSteps.length<10)s.peakSteps.push(false);
    // auto steps (M1-M3, OAS, SIA) are computed live now — clear any latched values
    PEAK_AUTO.forEach(i=>{if(s.peakSteps[i]){s.peakSteps[i]=false;S._rosterDirty=true;}});
    ['medical'].forEach(k=>{
      if(s[k]!=null){delete s[k];S._gmPurged=true;}});

    if(s.g2name==null)s.g2name='';if(s.g2phone==null)s.g2phone='';if(s.g2email==null)s.g2email='';

    if(!s.msOpening||s.msOpening.Community!=null){

      const old=(s.msOpening&&s.msOpening.Community!=null)?s.msOpening:null;

}
